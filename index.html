<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a1f">
<title>In Shiva's Eyes 牌卡</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Fredoka:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap">
<style>
/* Layout: night-sky page. Starfield + drifting nebula behind; hero with forehead motif (crescent, three ash lines, vermilion tilak, opening eye); card strip; tabbed draw / gallery / admin; deck cover as back page. */
:root{
  --bg:#0c0a1f; --surface:rgba(30,24,66,.72); --surface-solid:#1b1540; --surface2:#261e55; --line:rgba(167,157,230,.24);
  --fg:#ece8f8; --muted:#a8a1c9; --moon:#f4efe1; --skin:#9a95e0; --tilak:#e0502f; --gold:#e0ae4c;
  --on-accent:#150f30; --danger:#ff9d89; --star:#ece8ff; --neb1:rgba(112,94,220,.40); --neb2:rgba(224,80,47,.13); --veil:rgba(9,7,26,.74);
  --f-display:"Pacifico",var(--f-body);
  --f-en:"Pacifico",var(--f-body);
  --f-body:"Fredoka","Noto Sans TC","PingFang TC","Microsoft JhengHei","微軟正黑體","Heiti TC",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f1eef9; --surface:rgba(255,255,255,.82); --surface-solid:#ffffff; --surface2:#e7e1f5; --line:rgba(84,70,160,.22);
  --fg:#1c1540; --muted:#5d5683; --moon:#2a2060; --skin:#5a53b0; --tilak:#c23a22; --gold:#8c5810;
  --on-accent:#ffffff; --danger:#b3392b; --star:#7b71cc; --neb1:rgba(150,130,235,.30); --neb2:rgba(224,110,80,.14); --veil:rgba(248,245,252,.86); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f1eef9; --surface:rgba(255,255,255,.82); --surface-solid:#ffffff; --surface2:#e7e1f5; --line:rgba(84,70,160,.22);
  --fg:#1c1540; --muted:#5d5683; --moon:#2a2060; --skin:#5a53b0; --tilak:#c23a22; --gold:#8c5810;
  --on-accent:#ffffff; --danger:#b3392b; --star:#7b71cc; --neb1:rgba(150,130,235,.30); --neb2:rgba(224,110,80,.14); --veil:rgba(248,245,252,.86); color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.75 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1080px;margin:0 auto;position:relative;z-index:1}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.svg-defs{position:absolute;width:0;height:0}
.muted{color:var(--muted)}

/* background fx */
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgfx canvas{position:absolute;inset:0}
#bgfx .bgimg{position:absolute;inset:-3%;background:center top/cover no-repeat;animation:bgzoom 60s ease-in-out infinite alternate}
#bgfx .bgimg::after{content:"";position:absolute;inset:0;background:var(--veil)}
@keyframes bgzoom{to{transform:scale(1.06) translateY(-1%)}}
#bgfx .neb{position:absolute;border-radius:50%;filter:blur(70px);animation:nebdrift 48s ease-in-out infinite alternate}
#bgfx .a{width:62vmax;height:62vmax;left:-22vmax;top:-26vmax;background:radial-gradient(circle,var(--neb1),transparent 66%)}
#bgfx .b{width:56vmax;height:56vmax;right:-24vmax;top:34vh;background:radial-gradient(circle,var(--neb2),transparent 66%);animation-duration:64s;animation-direction:alternate-reverse}
@keyframes nebdrift{to{transform:translate(7vmax,5vmax) scale(1.12)}}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding:20px 0 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .eye{width:60px;height:90px;color:var(--gold);flex:none;transition:transform .3s}
.brand:hover .eye{transform:translateY(-4px) rotate(-5deg) scale(1.06)}
@keyframes emblem{50%{filter:drop-shadow(0 0 7px var(--gold))}}
.brand .nm{font:400 2.2rem/1 var(--f-en);color:var(--moon)}
.brand .sub{font-size:.74rem;font-family:var(--f-body);letter-spacing:.2em;color:var(--muted);margin-top:5px}
nav{display:flex;gap:2px;overflow-x:auto;max-width:100%}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;color:var(--muted);white-space:nowrap;font-weight:500;transition:color .2s,border-color .2s}
nav button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--tilak)}
nav button:hover{color:var(--fg)}

/* shared */
.eyebrow{font-size:.74rem;letter-spacing:.22em;color:var(--skin);font-weight:500}
.btn{background:var(--gold);color:var(--on-accent);border:0;border-radius:4px;padding:11px 24px;font-weight:700;letter-spacing:.06em;transition:filter .2s,transform .2s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{border-color:var(--gold)}
.btn.small{padding:6px 12px;font-size:.86rem;letter-spacing:0}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:99px;padding:1px 12px;font-size:.84rem;color:var(--muted)}
.sample-note{margin-top:20px;border:1px dashed var(--skin);border-radius:8px;padding:10px 14px;font-size:.9rem;color:var(--muted)}
.cardimg{display:block;width:100%;aspect-ratio:.66;object-fit:cover;object-position:50% 100%;background:var(--surface2);border-radius:7px}
.cardimg.land{aspect-ratio:1.5}
.ph{display:block;width:100%;aspect-ratio:.66;border-radius:7px;object-fit:cover}
.tri{display:grid;gap:6px;width:92px}
.tri i{height:3px;border-radius:2px;background:var(--moon);opacity:.9;transform-origin:left;animation:grow .9s both}
.tri i:nth-child(2){animation-delay:.15s}.tri i:nth-child(3){animation-delay:.3s}
@keyframes grow{from{transform:scaleX(0)}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px 40px;align-items:center;padding:48px 0 18px}
.hero-text{display:grid;gap:18px;justify-items:start}
.hero-text>*{animation:rise .9s both}
.hero-text>*:nth-child(2){animation-delay:.12s}.hero-text>*:nth-child(3){animation-delay:.24s}.hero-text>*:nth-child(4){animation-delay:.36s}.hero-text>*:nth-child(5){animation-delay:.48s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.wordmark{font:400 clamp(3.6rem,10vw,5.6rem)/1.05 var(--f-en);color:var(--moon)}
.wordmark span{display:block;font:400 .2em/1.4 var(--f-display);letter-spacing:.42em;color:var(--skin);font-style:normal;margin-top:14px}
.lede{color:var(--muted);max-width:34em}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.art{justify-self:center;width:min(100%,300px)}
.art.v1 svg{display:block;width:100%;height:auto;overflow:visible}
.art .moon{animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{filter:drop-shadow(0 0 14px var(--moon))}}
.art .ash{animation:inkdraw 1.3s cubic-bezier(.3,.7,.2,1) both}
.art .ash2{animation-delay:.25s}.art .ash3{animation-delay:.5s}
@keyframes inkdraw{from{stroke-dashoffset:170}}
.art .tilak{transform-box:fill-box;transform-origin:50% 50%;animation:tilak 1.2s 1s cubic-bezier(.3,.7,.2,1) both,glow 4.5s 2.2s ease-in-out infinite}
@keyframes tilak{from{transform:scaleY(0);opacity:0}}
@keyframes glow{50%{filter:drop-shadow(0 0 9px var(--tilak))}}
.art .eyeout{stroke-dasharray:420;animation:inkdraw2 1.6s 1.4s ease both}
@keyframes inkdraw2{from{stroke-dashoffset:420}}
.art .blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 9s 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.art .iris{transform-box:fill-box;transform-origin:50% 50%;animation:irisopen 1.1s 2.6s cubic-bezier(.3,.7,.2,1) both}
@keyframes irisopen{from{transform:scaleY(.02);opacity:0}}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr);padding-top:32px}.art{width:200px;order:-1;justify-self:start}}


/* hero portrait: arch window with 108-bead mala, crescent and trident */
.art.v2{position:relative;width:min(100%,340px);aspect-ratio:1}
.art.v2 svg{position:absolute;overflow:visible;display:block}
.art.v2 .mala,.art.v2 .rings{inset:0;width:100%;height:100%}
.mala{animation:spin 170s linear infinite}
.rings{animation:spin 100s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.arch{position:absolute;left:24%;right:24%;top:14%;bottom:12%;border-radius:999px 999px 10px 10px;overflow:hidden;
  box-shadow:0 0 0 1px var(--gold),0 0 0 7px var(--bg),0 0 0 8px var(--line),0 24px 60px rgba(0,0,0,.5),0 0 70px var(--neb1);animation:rise 1.2s .3s both}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;animation:kb2 28s ease-in-out infinite alternate;transform-origin:50% 35%}
.arch::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,color-mix(in srgb,var(--bg) 55%,transparent)),linear-gradient(105deg,transparent 40%,rgba(255,255,255,.16) 50%,transparent 60%);background-size:100% 100%,250% 100%;animation:glint 9s 2s ease-in-out infinite}
@keyframes kb2{to{transform:scale(1.1)}}
@keyframes glint{0%{background-position:0 0,150% 0}60%,100%{background-position:0 0,-50% 0}}
.art.v2 .crescent{left:50%;top:-1%;width:21%;height:auto;transform:translateX(-50%);animation:rise 1.2s .9s both}
.art.v2 .trident{right:-3%;top:4%;width:20%;height:auto;transform-origin:50% 100%;animation:sway 9s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.trident path{stroke-dasharray:1;animation:draw1 2s .5s ease both}
@keyframes draw1{from{stroke-dashoffset:1}}
@media (max-width:760px){.art.v2{width:min(100%,260px)}}

/* card strip */
.strip{overflow:hidden;margin:26px 0 8px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.track{display:flex;gap:14px;width:max-content;animation:drift 80s linear infinite}
.strip:hover .track{animation-play-state:paused}
@keyframes drift{to{transform:translateX(-50%)}}
.strip button{background:none;border:0;padding:0;height:200px;flex:none;transition:transform .3s,filter .3s;filter:saturate(.9)}
.strip button:hover{transform:translateY(-6px);filter:saturate(1.15)}
.strip .cardimg,.strip .ph{width:auto;height:100%}

/* draw */
.sec-title{display:grid;gap:8px;padding:36px 0 6px}
.sec-title h2{font-size:clamp(1.5rem,4vw,2rem)}
.controls{display:grid;gap:22px;margin:18px 0 6px}
.field{display:grid;gap:7px;font-size:.86rem;color:var(--muted)}
.field input,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:var(--fg);width:100%}
.field textarea{resize:vertical;min-height:84px}
.row{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;padding:9px 18px;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--tilak)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{background:none;border:1px solid var(--line);border-radius:99px;padding:5px 15px;color:var(--muted);font-size:.92rem;transition:all .2s}
.pills button:hover{border-color:var(--skin);color:var(--fg)}
.pills button[aria-pressed="true"]{background:var(--skin);border-color:var(--skin);color:var(--on-accent);font-weight:700}
.q{flex:1 1 280px;min-width:0}
.stage{position:relative;margin:26px 0;min-height:380px;display:grid;place-items:center;border:1px solid var(--line);border-radius:16px;background:radial-gradient(60% 70% at 50% 40%,var(--neb1),transparent 75%),var(--surface);padding:32px 12px;overflow:hidden}
.pile{position:relative;width:150px;aspect-ratio:.66;margin:0 auto}
.pile .cb{position:absolute;inset:0}
.pile .cb:nth-child(1){transform:rotate(-6deg)}
.pile .cb:nth-child(2){transform:rotate(-2deg) translateX(4px)}
.pile .cb:nth-child(3){transform:rotate(2deg)}
.pile .cb:nth-child(4){transform:rotate(6deg) translateX(-4px)}
.pile::after{content:"";position:absolute;inset:-26px;border-radius:50%;border:1px solid var(--skin);opacity:.4;animation:ring 3.6s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.12);opacity:.15}}
.shuffling .cb:nth-child(odd){animation:shufA .6s ease-in-out 2}
.shuffling .cb:nth-child(even){animation:shufB .6s ease-in-out 2}
@keyframes shufA{50%{transform:translateX(-100px) rotate(-14deg)}}
@keyframes shufB{50%{transform:translateX(100px) rotate(14deg)}}
.cb{border-radius:9px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.backimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cb .frame{position:absolute;inset:6px;border:1px solid var(--gold);border-radius:6px;opacity:.7;pointer-events:none}
.cb .frame::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(12,10,31,.7))}
.cb .eye{position:absolute;left:50%;bottom:7%;width:22%;height:auto;transform:translateX(-50%);color:var(--gold)}
.cb svg.fallback{position:absolute;inset:0;width:100%;height:100%}
.deal{display:grid;gap:14px;width:100%;justify-items:center;align-items:start}
.deal.n1{grid-template-columns:minmax(0,1fr)}
.deal.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.slot{width:100%;display:grid;gap:10px;justify-items:center;text-align:center;animation:dealin .7s cubic-bezier(.2,.8,.2,1) both}
.slot:nth-child(2){animation-delay:.12s}.slot:nth-child(3){animation-delay:.24s}
@keyframes dealin{from{opacity:0;transform:translateY(-36px) scale(.9) rotate(-3deg)}}
.slot .lbl{font-size:.8rem;letter-spacing:.2em;color:var(--skin)}
.flip{width:min(100%,230px);aspect-ratio:.66;perspective:1000px;background:none;border:0;padding:0}
.flip.land{width:min(100%,360px);aspect-ratio:1.5}
.flip-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.flipped .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:9px;overflow:hidden}
.face.front{transform:rotateY(180deg);box-shadow:0 0 0 1px var(--gold),0 12px 40px rgba(0,0,0,.45)}
.face.front .cardimg,.face.front .ph{height:100%;aspect-ratio:auto}
.face.front::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.3) 50%,transparent 65%);transform:translateX(-120%)}
.flipped .face.front::after{animation:sheen 1.4s .7s ease}
@keyframes sheen{to{transform:translateX(120%)}}
.hint{font-size:.86rem;color:var(--muted)}
.stage-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.reading{display:grid;gap:20px}
.overall{border:1px solid var(--gold);border-radius:16px;padding:24px;background:linear-gradient(160deg,var(--surface),transparent);box-shadow:0 0 40px var(--neb1);display:grid;gap:12px;animation:rise .9s both}
.overall h3{font-size:1.35rem}.overall ul{margin:0;padding-left:1.2em;display:grid;gap:8px}.overall .small{font-size:.85rem}
.rd{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 26px 28px;display:grid;gap:14px;animation:rise .6s both}
.rd .pos{font-size:.78rem;letter-spacing:.22em;color:var(--skin);font-weight:500}
.rd h2,.rd h3{font-size:1.6rem}
.en{font:400 2rem/1.2 var(--f-en);color:var(--muted)}
.quote{font:italic 400 1rem/1.6 var(--f-body);color:var(--moon);max-width:46ch}
.quote small{display:block;font:400 .86rem var(--f-body);font-style:normal;color:var(--muted);margin-top:3px}
.ctabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:4px}
.ctabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 13px;color:var(--muted);white-space:nowrap;font-size:.92rem}
.ctabs button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--tilak)}
.ctabs button:hover{color:var(--fg)}
.focus{display:grid;gap:8px;animation:rise .5s both}
.focus h4,.blk h4{font-size:.8rem;letter-spacing:.2em;color:var(--gold);font-weight:700}
.focus .txt{color:var(--muted)}
.focus .note{font-size:.82rem;color:var(--muted)}
.blk{display:grid;gap:6px}
.txt{white-space:pre-line;max-width:66ch}
.blk .txt{color:var(--muted)}

/* gallery */
.sec-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;padding:38px 0 22px}
.sec-head h1{font-size:2rem}
.search{width:min(100%,280px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));grid-auto-flow:dense;gap:26px 16px}
.tile{background:none;border:0;padding:0;text-align:left;display:grid;gap:9px;align-content:start;perspective:700px}
.tile.land{grid-column:span 2}
.tile .frame{transition:transform .25s ease-out,box-shadow .25s;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));border-radius:7px}
.tile:hover .frame{box-shadow:0 10px 34px rgba(0,0,0,.4),0 0 0 1px var(--gold)}
.tile .no{font-size:.74rem;letter-spacing:.18em;color:var(--skin)}
.tile .nm{font-family:var(--f-display);font-weight:500;line-height:1.35}
.empty{padding:56px 0;color:var(--muted);text-align:center}

/* overlay */
#overlay:empty{display:none}
#overlay{position:fixed;inset:0;z-index:30;background:rgba(8,6,22,.82);overflow:auto;animation:fade .25s both;
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@keyframes fade{from{opacity:0}}
.sheet{max-width:900px;margin:0 auto;background:var(--surface-solid);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;position:relative;animation:rise .4s both}
.sheet .x{position:absolute;top:12px;right:12px}
.sheet .pic img,.sheet .pic svg{width:100%;height:auto;aspect-ratio:auto;border-radius:8px;display:block}
.sheet .body{display:grid;gap:14px;align-content:start;padding-top:16px}
.sheet h2{font-size:1.8rem}
@media (max-width:660px){.sheet{grid-template-columns:minmax(0,1fr)}.sheet .pic{max-width:300px;margin:0 auto}.deal.n3{gap:8px}.flip.land{width:100%}}

.langbtn{margin-left:10px;border:1px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:6px 14px;font:inherit;font-size:.85rem;cursor:pointer}.langbtn:hover{border-color:var(--gold);color:var(--gold)}
.speak{margin:10px 0 2px;border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:999px;padding:7px 16px;font:inherit;font-size:.9rem;cursor:pointer;transition:background .2s,color .2s}
.speak:hover,.speak.on{background:var(--gold);color:var(--bg)}.speak[hidden]{display:none}
.homefoot{display:grid;justify-items:center;gap:10px;text-align:center;padding:40px 0 30px;margin-top:20px;border-top:1px solid var(--line)}
.hf-orb{position:relative;width:120px;height:120px;display:grid;place-items:center}
.hf-ring{position:absolute;inset:0;width:100%;height:100%;animation:lvhf 60s linear infinite}
.hf-emb{width:60px;height:90px;color:var(--gold);filter:drop-shadow(0 0 10px rgba(224,174,76,.45))}
@keyframes lvhf{to{transform:rotate(360deg)}}
.hf-name{font:700 1.5rem var(--f-display);letter-spacing:.2em}
.hf-line{color:var(--muted);margin:0}
.hf-link{margin-top:8px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:7px 18px;font-size:.88rem;text-decoration:none;transition:background .2s,color .2s}.hf-link:hover{background:var(--gold);color:var(--bg)}
.hf-small{color:var(--muted);font-size:.78rem;max-width:52ch;margin:6px 0 0;opacity:.85}
/* ---------- multi-deck home ---------- */
.brand{cursor:pointer}
.brand .nm.zh{font:700 1.7rem/1.1 var(--f-display);letter-spacing:.08em}
.homehero .wordmark{font-family:var(--f-display);font-weight:700;letter-spacing:.06em}
.homehero .wordmark span{font:400 .22em/1.4 var(--f-en);letter-spacing:.2em;font-size:.4em;color:var(--skin)}
.fan{position:relative;height:clamp(280px,40vw,400px);width:100%;max-width:440px;margin:0 auto}
.fan .fc{position:absolute;left:50%;bottom:0;width:min(36%,150px);aspect-ratio:2/3;border-radius:10px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 0 1px var(--line);transform-origin:50% 130%;transform:translateX(-50%) rotate(var(--r,0deg));animation:lvfan 6s ease-in-out infinite;animation-delay:calc(var(--i,0) * -1.1s);transition:filter .3s}
.fan .fc img{display:block;width:100%;height:100%;object-fit:cover}
@keyframes lvfan{0%,100%{transform:translateX(-50%) rotate(var(--r,0deg))}50%{transform:translateX(-50%) rotate(calc(var(--r,0deg) + 3.5deg)) translateY(-8px)}}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:22px;padding:14px 0 30px}
.deckcard{display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:center;text-align:left;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--veil);color:inherit;font:inherit;cursor:pointer;position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s,border-color .3s,opacity .8s ease var(--d,0ms)}
.deckcard:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 18px 44px rgba(0,0,0,.3),0 0 26px rgba(224,174,76,.28)}
.deckcard .dc-img{display:block;aspect-ratio:2/3;border-radius:9px;overflow:hidden;background:var(--surface2);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.deckcard .dc-img img,.deckcard .dc-img svg{display:block;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.deckcard:hover .dc-img img{transform:scale(1.08)}
.deckcard .dc-body{display:grid;gap:5px;align-content:center}
.deckcard b{font:700 1.2rem/1.3 var(--f-display)}
.deckcard .dc-sub{color:var(--gold);font-size:.82rem;letter-spacing:.18em}
.deckcard .dc-desc{color:var(--muted);font-size:.9rem;line-height:1.6;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.deckcard .dc-meta{color:var(--skin);font-size:.82rem;margin-top:4px;transition:letter-spacing .3s}
.deckcard:hover .dc-meta{letter-spacing:.08em;color:var(--gold)}
.deckcard.soon{border-style:dashed;cursor:default;opacity:.85}
.deckcard.soon:hover{transform:none;box-shadow:none;border-color:var(--line)}
.deckcard.soon .dc-img{display:grid;place-items:center;color:var(--gold);background:transparent;box-shadow:none;border:1px dashed var(--line)}
.deckcard.soon .dc-img svg{width:56%;height:auto;animation:lvbreathe 4s ease-in-out infinite}
@media (max-width:480px){.deckcard{grid-template-columns:84px 1fr}}
/* ---------- lively deck page ---------- */
.rv{opacity:0;transform:translateY(26px) scale(.98);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
.about{overflow-x:clip;position:relative}
.cvw{position:relative;isolation:isolate}
.cvw .mand{position:absolute;left:50%;top:50%;width:175%;max-width:none;aspect-ratio:1;transform:translate(-50%,-50%);z-index:-1;opacity:.7;animation:lvspin 90s linear infinite;pointer-events:none}
.cvw .mand .m2{transform-origin:170px 170px;animation:lvspin2 50s linear infinite reverse}
.cvw::after{content:"";position:absolute;inset:-8%;z-index:-2;background:radial-gradient(closest-side,rgba(224,174,76,.28),transparent 70%);animation:lvbreathe 5s ease-in-out infinite;pointer-events:none}
.about .cv{animation:floaty 7s ease-in-out infinite}
.about .cv::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:lvsheen 6s ease-in-out 1.5s infinite;pointer-events:none}
.about .cv{position:relative}
.sparks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sparks i{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);opacity:0;animation:lvrise 9s ease-in infinite}
.sparks i:nth-child(1){left:8%;animation-delay:0s}.sparks i:nth-child(2){left:22%;animation-delay:2.2s;width:3px;height:3px}.sparks i:nth-child(3){left:41%;animation-delay:4.5s}.sparks i:nth-child(4){left:63%;animation-delay:1.3s;width:4px;height:4px}.sparks i:nth-child(5){left:81%;animation-delay:3.6s}.sparks i:nth-child(6){left:93%;animation-delay:6s;width:3px;height:3px}
@keyframes lvspin2{to{transform:rotate(360deg)}}
@keyframes lvspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -9px}}
@keyframes lvbreathe{0%,100%{opacity:.5;transform:scale(.96)}50%{opacity:1;transform:scale(1.05)}}
@keyframes lvsheen{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
@keyframes lvrise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translateY(-420px) translateX(24px) scale(1.2);opacity:0}}
.about h2{background:linear-gradient(90deg,var(--fg),var(--gold),var(--fg));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 7s linear infinite}
@keyframes shimmer{to{background-position:200% center}}
.orn{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 26px;color:var(--gold)}
.orn .ln{flex:1;height:1px;max-width:260px;background:linear-gradient(90deg,transparent,var(--gold));transform:scaleX(0);transform-origin:right;transition:transform 1.2s ease .2s}
.orn .ln.r{background:linear-gradient(270deg,transparent,var(--gold));transform-origin:left}
.orn.in .ln{transform:scaleX(1)}
.orn svg{width:46px;height:46px;overflow:visible}
.orn svg path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s ease .3s}
.orn.in svg path{stroke-dashoffset:0}
.orn.in svg{animation:lvbreathe 4s ease-in-out 2s infinite}
.feat{position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s,border-color .3s,opacity .8s ease var(--d,0ms)}
.feat:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 16px 40px rgba(0,0,0,.25),0 0 22px rgba(224,174,76,.25)}
.feat .ic{display:block;width:44px;height:44px;margin-bottom:8px;color:var(--gold);transition:transform .5s}
.feat:hover .ic{transform:rotate(-8deg) scale(1.15)}
.feat .ic *{vector-effect:non-scaling-stroke}
.feat::before{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(closest-side,rgba(224,174,76,.25),transparent);transition:transform .6s}
.feat:hover::before{transform:scale(2.2)}
.steps{position:relative}
.steps .num{position:relative;transition:transform .3s,background .3s,color .3s}
.steps li:hover .num{transform:scale(1.18) rotate(8deg);background:var(--gold);color:var(--bg)}
.steps .num::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--gold);opacity:0;animation:ping 3s ease-out infinite}
.steps li:nth-child(2) .num::after{animation-delay:.7s}.steps li:nth-child(3) .num::after{animation-delay:1.4s}.steps li:nth-child(4) .num::after{animation-delay:2.1s}
@keyframes ping{0%{transform:scale(.8);opacity:.8}70%,100%{transform:scale(1.7);opacity:0}}
.intro .cta .btn{position:relative;overflow:hidden;animation:lvglow 3s ease-in-out infinite}
.intro .cta .btn:hover{transform:translateY(-3px) scale(1.03)}
@keyframes lvglow{0%,100%{box-shadow:0 0 0 0 rgba(224,174,76,.45)}50%{box-shadow:0 0 0 12px rgba(224,174,76,0)}}
.tile .frame{position:relative;overflow:hidden}
.tile .frame::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);transform:translateX(-130%);transition:transform .8s}
.tile:hover .frame::after{transform:translateX(130%)}
.tile:hover .nm{color:var(--gold)}.tile .nm{transition:color .25s}
.tile:hover .no{letter-spacing:.3em}.tile .no{transition:letter-spacing .3s}
.grid .tile.rv .frame{animation:floaty 6s ease-in-out infinite;animation-delay:calc(var(--d,0ms) * -4)}
.god{position:relative}
.god img{transition:transform .6s,box-shadow .6s}
.god:hover img{transform:scale(1.04) rotate(-.8deg);box-shadow:0 22px 60px rgba(0,0,0,.5),0 0 40px rgba(224,174,76,.35),0 0 0 1px var(--gold)}
.trinity .eyebrow::before,.trinity .eyebrow::after{content:"✦";margin:0 8px;color:var(--gold);display:inline-block;animation:twinkle 2.6s ease-in-out infinite}
.trinity .eyebrow::after{animation-delay:1.3s}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(90deg)}}
@media (max-width:660px){.cvw .mand{width:135%}}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.orn .ln{transform:none}.orn svg path{stroke-dashoffset:0}}
/* about + trinity */
.about{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px 40px;align-items:center;padding:6px 0 30px}
.about .cv{border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px var(--line)}
.about .cv img{display:block;width:100%;height:auto}
.about h2{font-size:1.7rem;margin:4px 0 10px}.about p{color:var(--muted)}
.trinity{padding:10px 0 20px;margin-top:44px}.trinity h2{font-size:1.6rem}.trinity .lead{color:var(--muted);margin:8px 0 18px}
.gods{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px}
.god{margin:0;display:grid;gap:12px}.god img{display:block;width:100%;height:auto;border-radius:12px;box-shadow:0 16px 44px rgba(0,0,0,.45),0 0 0 1px var(--line)}
.god b{font:700 1.15rem var(--f-display)}.god .rl{color:var(--gold);font-size:.9rem;margin-left:8px}.god p{color:var(--muted);font-size:.95rem;margin-top:4px}
.about .sm{font-size:.9rem;margin-top:10px}
.intro{padding:0 0 26px}.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.feat{padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--veil)}.feat b{font:700 1.05rem var(--f-display);color:var(--gold)}.feat p{color:var(--muted);font-size:.93rem;margin-top:6px}
.cta{margin-top:22px;text-align:center}.cta .btn{font-size:1.05rem;padding:12px 28px}
.ihow{font:700 1.3rem var(--f-display);margin:28px 0 12px}
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.steps li{display:flex;gap:12px;align-items:flex-start}.steps .num{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:700}
.steps b{display:block}.steps p{color:var(--muted);font-size:.92rem;margin-top:2px}
@media (max-width:660px){.about{grid-template-columns:minmax(0,1fr)}.about .cv{max-width:300px;margin:0 auto}}
/* back page (封底) */
.coverpage{position:relative;margin:56px 0 0;display:grid;justify-items:center;gap:16px}
.coverpage .cv{position:relative;width:min(100%,520px);border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px var(--line)}
.coverpage .cv img{display:block;width:100%;height:auto;animation:kb 34s ease-in-out infinite alternate;transform-origin:50% 30%}
@keyframes kb{to{transform:scale(1.07)}}
.coverpage .cv::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);transform:translateX(-120%);animation:sheen2 9s 2s ease-in-out infinite}
@keyframes sheen2{60%,100%{transform:translateX(120%)}}
.coverpage .cap{font:400 1.7rem/1.2 var(--f-en);color:var(--muted);letter-spacing:.06em;text-align:center}

/* admin */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--surface-solid);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:28px 0 18px}
.bar.dirty{border-color:var(--gold)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.drop{border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted);font-size:.9rem;margin-bottom:20px}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:22px}
.setbox{display:grid;grid-template-columns:80px minmax(0,1fr);gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.setbox img{width:100%;height:auto;border-radius:6px;display:block}
.setbox .t{font-weight:700;margin-bottom:6px}
.arow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}

.fileb{position:relative;overflow:hidden;display:inline-block}
.fileb input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:40;background:var(--moon);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:.92rem;max-width:90vw}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.strip{overflow-x:auto}}

.shopcta .sc-t{flex:1 1 320px}.shopcta h3{margin:4px 0 6px;font-size:1.3rem}.shopcta p{margin:0;opacity:.85}.shopcta .btn{white-space:nowrap;text-decoration:none}

/* 首頁專屬配色(與牌組頁區隔):暖橘桃 + 青綠 */

:root[data-page="home"][data-theme="light"]{--bg:#fff3e2;--surface:rgba(255,255,255,.86);--surface-solid:#ffffff;--surface2:#ffe4c8;--line:rgba(214,108,58,.28);--fg:#3b1f2a;--muted:#7a5560;--moon:#5a2a35;--skin:#e2603f;--tilak:#e2603f;--gold:#c9701a;--on-accent:#ffffff;--star:#f0a05a;--neb1:rgba(255,168,110,.38);--neb2:rgba(80,200,185,.26);--veil:rgba(255,245,232,.86)}
@keyframes lvtw{0%,100%{opacity:.25}50%{opacity:1}}
.lv-tw{animation:lvtw 2.4s ease-in-out infinite}
.tile.locked{cursor:default;pointer-events:none}.tile.locked .frame{opacity:.85}.tile.locked .nm{color:var(--muted)}
.partial-note{text-align:center;color:var(--muted);margin:18px auto 0;max-width:560px;font-size:.95rem}

<script type="application/json" id="cards-data">{"v": 3, "decks": [{"slug": "shiva", "name": "In Shiva's Eyes", "name_en": "In Shiva's Eyes", "sub": "神諭卡", "sub_en": "Oracle Deck", "descr": "由 Divinye Studio 創作的神諭卡,以濕婆的視角陪你看見內在的聲音。共 40 張,每張都有牌意與七個生活面向的解讀。", "descr_en": "An oracle deck by Divinye Studio. Seen through Shiva’s eyes, the cards help you hear your inner voice, each with readings for seven areas of life.", "published": true, "sort": 0, "settings": {"bg": "images/bg.jpg", "back": "images/back.jpg", "cover": "images/cover.jpg", "god1": "images/brahma.jpg", "god2": "images/vishnu.jpg", "god3": "images/shiva.jpg", "show_count": 8, "shop_url": "https://athenalee768.github.io/eight-auspicious/shop.html"}, "cards": [{"id": "c01", "no": "1", "name": "本源", "en": "Origin", "tag": "Living in harmony with the Universe.", "tagZh": "與宇宙和諧共處。", "keywords": "合一、和諧、陰陽平衡、回到本源", "meaning": "「本源」是這副牌的起點。祂提醒你,內在的陰與陽、剛與柔、行動與等待,本來就不是對立,而是同一個整體的兩面。當你不再與自己拉扯,生命自然回到和諧的節奏。", "extended": "畫面中,濕婆與他的神聖伴侶合為同一張面容,一半是他,一半是她,象徵二元的統合。\n這張牌邀請你檢視:你正在壓抑或排斥自己的哪一個面向?允許兩種力量並存,力量才會完整。也可以把它當作新階段的開場:回到最初的心意,重新與自己對齊。", "cats": {"work": "在工作上,別再把「理性」與「直覺」、「競爭」與「合作」對立。找到團隊中互補的角色,讓不同風格的人各司其職,事情會比單打獨鬥順暢。也適合回頭確認:這份工作是否仍和你最初的熱忱一致?", "health": "身心需要的是平衡而非極端:動與靜、工作與休息、享受與節制之間,找到屬於你的中道。留意情緒與身體如何互相影響,讓作息順著自然的節律。", "love": "關係的和諧來自兩個完整的人相遇,而不是互相補足缺口。先與自己和好,再談與對方的共處。也留意是否總是一方在付出、一方在退讓,練習彼此尊重差異。", "family": "家中不同世代、不同性格,像不同的音階。和諧不是整齊劃一,而是各自存在又彼此呼應。這張牌提醒你,在家裡少一點評斷,多一點理解每個人所站的位置。", "social": "接納與你不同的人,也接納自己不同的面向。不需要為了合群而變形,真誠的存在本身就會吸引對的人。", "money": "財務上追求平衡:收入與支出、進取與保守、享受與儲備。不要只押一邊,讓資源像陰陽一樣流動循環,長期會更穩。", "growth": "回到內在的源頭,感受自己與萬物並非分離。靜坐、獨處,或在自然中安靜待一會兒,都能幫你重新接上「我是整體的一部分」的感覺。"}, "img": "images/01-origin.jpg", "land": false, "i18n": {"en": {"kw": "Oneness, harmony, balance of yin and yang, return to the source", "m": "“Origin” is where this deck begins. It reminds you that yin and yang, firmness and softness, action and waiting are not opposites but two sides of one whole. When you stop struggling against yourself, life returns to its natural harmony.", "e": "In the image, Shiva and his divine consort share a single face, half him and half her, symbolizing the union of duality.\nThis card invites you to look at which part of yourself you are suppressing or rejecting. Allow both forces to coexist and your strength becomes whole. It can also open a new chapter: return to your original intention and realign with yourself.", "cats": {"work": "At work, stop setting “logic” against “intuition” or “competition” against “cooperation.” Find complementary roles in your team and let different styles do what they do best. It is also a good moment to ask whether this job still matches the passion you started with.", "health": "Your body and mind need balance, not extremes: movement and stillness, work and rest, indulgence and restraint. Find your own middle way. Notice how emotions and body affect each other, and let your routine follow its natural rhythm.", "love": "Harmony in love comes from two whole people meeting, not from filling each other’s gaps. Make peace with yourself first, then with your partner. Also notice whether one person is always giving and the other always yielding, and practice respecting differences.", "family": "Different generations and personalities at home are like different notes in a scale. Harmony is not uniformity but each voice existing and echoing the others. Judge less at home and try to understand where each person stands.", "social": "Accept people who are different from you, and accept the different sides of yourself. You do not need to reshape yourself to fit in; a genuine presence attracts the right people.", "money": "Seek balance in finances: income and spending, boldness and caution, enjoyment and reserves. Do not bet on one side only. Let resources circulate like yin and yang, and you will be steadier in the long run.", "growth": "Return to your inner source and feel that you are not separate from everything else. Sitting quietly, spending time alone, or resting in nature can reconnect you with the feeling that you are part of the whole."}}}}, {"id": "c02", "no": "2", "name": "能力", "en": "Capability", "tag": "Don't underestimate your ability to grow. Shine brighter than your yesterday-self.", "tagZh": "別低估你成長的能力,讓自己比昨天更閃耀。", "keywords": "潛能、成長、多面能力、自我超越", "meaning": "你擁有的能力,比你以為的更多,也比你現在展現的更多。這張牌鼓勵你不要用過去的標準限制自己,真正的對手是昨天的自己,而不是別人。", "extended": "畫面中的濕婆展現出多張面孔、多隻手臂,各執不同的法器,象徵同一個人可以同時擁有多種才能與角色。\n提醒你:能力不是固定的,它會隨著使用而成長。問問自己:有哪一項天賦,我一直沒有認真拿出來用?今天比昨天多進步一點點,就已經足夠。", "cats": {"work": "這是肯定自己實力的時機。可以主動承接有挑戰的任務、說出你的想法,或開始學一項能延伸專業的新技能。你被低估,多半是因為你還沒有讓人看見。", "health": "身體也有成長的空間。循序漸進地增加活動量或建立新的健康習慣,別一次拚太猛。以「比昨天好一點」作為標準,持續比強度重要。", "love": "你值得被好好愛,也有能力經營好關係。不用懷疑自己「夠不夠好」,把注意力放在你能為關係帶來什麼成長,而不是和別人比較。", "family": "家人也許還用舊的眼光看你。你可以用實際的行動讓他們看見你的改變,同時也看見家人身上尚未被發現的長處。", "social": "展現你的專長與熱情,別因害怕被評價而退縮。在群體裡,你的貢獻會讓你自然被看見;也別吝於欣賞別人的亮點。", "money": "提升收入的關鍵,在於提升能力與價值:進修、考照、拓展技能或發展副業都值得評估。投資自己,是最穩當的投資之一。", "growth": "設定一個「超越昨天的自己」的小目標,並記錄進步。不與別人比,只與自己比,你的光會越來越穩定。"}, "img": "images/02-capability.jpg", "land": true, "i18n": {"en": {"kw": "Potential, growth, many-sided ability, self-transcendence", "m": "You have more ability than you think, and more than you are showing now. This card encourages you not to limit yourself by past standards. Your true rival is who you were yesterday, not other people.", "e": "Shiva appears with many faces and arms, each hand holding a different implement, symbolizing that one person can hold many talents and roles.\nIt reminds you that ability is not fixed; it grows with use. Ask yourself which gift you have never really put to work. Being a little better than yesterday is already enough.", "cats": {"work": "This is a good time to affirm your capability. Take on a challenging task, voice your ideas, or start learning a skill that extends your expertise. If you feel underestimated, it is often because people have not yet been shown what you can do.", "health": "Your body also has room to grow. Increase activity or build new healthy habits step by step, without pushing too hard at once. Use “a little better than yesterday” as your standard; consistency matters more than intensity.", "love": "You deserve to be loved well, and you are capable of nurturing a relationship. Stop doubting whether you are “good enough” and focus on the growth you can bring to the relationship rather than comparing yourself with others.", "family": "Family may still see you through old eyes. Let your actions show them how you have changed, and look for strengths in them that have gone unnoticed.", "social": "Show your skills and enthusiasm; do not shrink back for fear of judgment. In a group your contribution will make you visible. Be generous in appreciating other people’s strengths, too.", "money": "The key to earning more is increasing your ability and value: further study, certifications, new skills or a side project are all worth considering. Investing in yourself is among the steadiest investments.", "growth": "Set a small goal of surpassing yesterday’s self and record your progress. Compare only with yourself, and your light will grow steadier."}}}}, {"id": "c03", "no": "3", "name": "真我", "en": "Atman", "tag": "To connect with things, connect with your atman.", "tagZh": "想與萬物連結,先連結你的真我。", "keywords": "真我、內在連結、靈性、純粹覺知", "meaning": "「阿特曼」指的是每個人內在不變的真我。當你與它連結,與人、事、物的關係也會跟著清晰。外在的連結,從內在的連結開始。", "extended": "畫面是一片宇宙星雲,中央是純白的光芒,象徵內在最純粹、不被角色與情緒染色的存在。\n這張牌邀請你暫停向外尋找答案,回到安靜之處問自己:撇開身分、成就與他人的期待,我是誰?當你與真我相連,會更容易分辨什麼是真正屬於你的。", "cats": {"work": "回到初衷:你為什麼做這件事?當行動與內在價值一致,做起來會更有力量。若感到失去連結,先花時間獨處釐清,再決定下一步。", "health": "身與心是連在一起的。透過靜坐、呼吸、散步或書寫,感受身體正在說什麼。傾聽內在,比盲目追隨外在標準更能帶來平靜。", "love": "與其追問「對方怎麼想」,先問「我真正想要的是什麼」。當你與自己連結,才能真誠地與伴侶連結。若目前單身,這是認識自己的好時機。", "family": "與家人的連結,需要你先安住自己。少一點反應、多一點在場,用平靜的陪伴代替很多的話語,往往更有力量。", "social": "不必靠扮演角色來融入。以真實的自己與人相處,關係會更少耗損。感到疏離時,先回頭與自己靠近。", "money": "金錢決策要符合你的價值觀,而不是被他人與情緒牽動。做大筆決定之前,給自己一段安靜的時間,聽聽內心的聲音。", "growth": "每天留一小段不受打擾的時間與自己相處。真正的成長來自向內的覺察,而不是向外的堆疊。"}, "img": "images/03-atman.jpg", "land": false, "i18n": {"en": {"kw": "True self, inner connection, spirituality, pure awareness", "m": "“Atman” refers to the unchanging true self within each person. When you connect with it, your relationships with people and things become clearer too. Outer connection begins with inner connection.", "e": "The image is a cosmic nebula with a pure white light at its center, symbolizing the purest existence within you, untouched by roles and emotions.\nThis card invites you to stop searching outside for answers and ask yourself in a quiet place: setting aside identity, achievements and others’ expectations, who am I? When you are connected to your true self, it is easier to tell what truly belongs to you.", "cats": {"work": "Return to your original purpose: why are you doing this? When action matches inner values, it carries more power. If you feel disconnected, spend time alone to clarify before deciding your next step.", "health": "Body and mind are one. Through sitting, breathing, walking or writing, feel what your body is telling you. Listening inward brings more peace than blindly following outside standards.", "love": "Rather than asking “what does he or she think,” first ask “what do I really want?” Only when you are connected to yourself can you connect sincerely with a partner. If you are single, this is a good time to get to know yourself.", "family": "Connection with family requires you to settle yourself first. React less and be more present; calm company often says more than many words.", "social": "You do not need to play a role to fit in. Relating as your real self wears you out less. When you feel distant, come back closer to yourself first.", "money": "Let your money decisions reflect your values rather than being pulled around by others or by emotion. Before a big decision, give yourself a quiet stretch of time and listen to your inner voice.", "growth": "Set aside a little uninterrupted time each day to be with yourself. Real growth comes from looking inward, not from piling things up outside."}}}}, {"id": "c04", "no": "4", "name": "喜悅的節奏", "en": "Rhythm of Joy", "tag": "Listens to the beat of your heart.", "tagZh": "聆聽你心跳的節拍。", "keywords": "喜悅、舞動、心的節奏、活在當下", "meaning": "喜悅不是等外在條件齊備才降臨,而是順著自己心的節拍生活時,自然流露的狀態。這張牌請你放下「應該怎樣」,聽聽什麼才真正讓你的心跳動。", "extended": "畫面中,濕婆在光芒中起舞,手持小鼓,象徵創造與生命的律動。\n舞蹈沒有標準答案,只有真實與投入。你可以問自己:最近一次覺得全然自由、忘了時間,是什麼時候?把更多這樣的時刻,安排進生活裡。", "cats": {"work": "找回工作中的節奏與樂趣。調整步調,讓高度專注與休息交替,也可以替工作加入你喜歡的方式。當熱情被點燃,效率常會隨之而來。", "health": "活動身體能幫你釋放壓力,跳舞、散步、聽音樂都可以。選擇你真心喜歡的運動,比選擇「最有效」的更能持久。", "love": "在關係中保持輕盈與喜悅:一起笑、一起玩、一起創造小小的儀式。別讓關係只剩下責任,記得相處最初的快樂。", "family": "為家人安排一些共同的歡樂時光,一頓飯、一首歌、一段散步都好。喜悅的家庭氣氛,是最好的滋養。", "social": "與讓你放鬆、能自在做自己的人相處,會讓你充滿能量。你也可以主動帶動輕鬆的氛圍,你的快樂會感染周圍的人。", "money": "把錢花在真正讓你心跳加速的事物上,比隨波逐流的消費更有價值。同時留意別因一時興起而超出預算。", "growth": "練習覺察「什麼讓我心裡發光」,並每天給它一點空間。快樂不是獎勵,而是生活的方向感。"}, "img": "images/04-rhythm-of-joy.jpg", "land": false, "i18n": {"en": {"kw": "Joy, dance, the rhythm of the heart, living in the present", "m": "Joy does not arrive only after outer conditions are in place; it flows naturally when you live to the beat of your own heart. This card asks you to put down “what I should be” and listen to what truly makes your heart beat.", "e": "Shiva dances in a burst of light holding a small drum, symbolizing creation and the pulse of life.\nDance has no standard answer, only sincerity and commitment. Ask yourself when you last felt completely free and lost track of time, then make more room for such moments in your life.", "cats": {"work": "Recover the rhythm and enjoyment of your work. Adjust your pace, alternating deep focus with rest, and bring in ways of working you like. When passion is lit, efficiency often follows.", "health": "Moving your body releases stress, whether dancing, walking or listening to music. Choose exercise you truly enjoy; it lasts longer than whatever is “most effective.”", "love": "Keep lightness and joy in the relationship: laugh together, play together, create small rituals. Do not let the relationship become only duty; remember the happiness of the beginning.", "family": "Plan some joyful time with family: a meal, a song or a walk. A joyful atmosphere at home is the best nourishment.", "social": "Spending time with people who help you relax and be yourself fills you with energy. You can also set a light mood yourself; your happiness is contagious.", "money": "Spending on what truly makes your heart race is worth more than drifting along with consumption. Just take care not to exceed your budget on a whim.", "growth": "Practice noticing “what makes me glow inside” and give it a little room every day. Happiness is not a reward but a sense of direction for life."}}}}, {"id": "c05", "no": "5", "name": "期待", "en": "Expectation", "tag": "There are no shortcuts to success. Consistency is the key.", "tagZh": "成功沒有捷徑,持之以恆才是關鍵。", "keywords": "持續、踏實、耐心、不走捷徑", "meaning": "這張牌提醒你,期待要與行動相稱。願望可以實現,但需要日復一日的投入,而不是一次的衝刺或僥倖。穩定地持續,才是通往成功的路。", "extended": "畫面中,一道火焰之柱貫穿濕婆的面容,兩位神祇一上一下,彷彿在尋找它的盡頭,取自印度神話中火柱的故事,暗示真正的成就沒有捷徑可以投機。\n問問自己:我的期待背後,是否有足夠的日常行動支撐?把大目標拆成每天做得到的小步驟,也留意別因失望而過早放棄。", "cats": {"work": "專案或職涯目標需要長期耕耘,別期待立刻升遷或翻身。建立穩定的工作習慣與可衡量的里程碑,成果會在累積中顯現。", "health": "健康沒有速成,別被極端的方法吸引。規律作息、均衡飲食、持續運動,才是真正的長期投資。", "love": "感情需要時間培養信任。不要期待對方一夕之間改變,也別用過高的期待壓住彼此。用日常的關心與承諾,累積關係的深度。", "family": "家庭關係的改善來自一點一滴的互動,例如固定的相聚、耐心的溝通。別急著要求對方立即回應。", "social": "人脈與信任是慢慢累積的。持續而真誠的互動,比偶爾的大力社交更有效。", "money": "財富的累積靠紀律與時間:穩定儲蓄、分散且長期的配置,遠勝追逐一夜致富。對任何「快速獲利」的承諾保持警覺。", "growth": "把想培養的能力變成日常的小習慣,持續比天分重要。允許進度緩慢,但不要停下來。"}, "img": "images/05-expectation.jpg", "land": false, "i18n": {"en": {"kw": "Consistency, being grounded, patience, no shortcuts", "m": "This card reminds you that expectations must match action. Wishes can come true, but they take daily commitment rather than a single sprint or a stroke of luck. Steady persistence is the road to success.", "e": "A pillar of fire runs through Shiva’s face while two deities, one above and one below, seem to search for its end, drawn from the story of the fiery column in Indian myth, hinting that real achievement offers no shortcut.\nAsk yourself whether your expectations are backed by enough daily action. Break big goals into small steps you can do each day, and be careful not to give up too early out of disappointment.", "cats": {"work": "Projects and career goals need long-term cultivation; do not expect instant promotion or a turnaround. Build steady work habits and measurable milestones, and results will show through accumulation.", "health": "Health has no quick fix; do not be drawn to extreme methods. Regular sleep, balanced meals and consistent exercise are the real long-term investment.", "love": "Love needs time to build trust. Do not expect your partner to change overnight, and do not press on each other with expectations that are too high. Build depth through everyday care and commitment.", "family": "Family relationships improve through small, repeated interactions such as regular gatherings and patient communication. Do not rush to demand an immediate response.", "social": "Connections and trust build up slowly. Steady, sincere interaction works better than occasional bursts of networking.", "money": "Wealth is built on discipline and time: steady saving and diversified long-term allocation far outperform chasing overnight riches. Stay wary of any promise of “quick profit.”", "growth": "Turn the ability you want to develop into a small daily habit; persistence matters more than talent. Allow progress to be slow, but do not stop."}}}}, {"id": "c06", "no": "6", "name": "圓滿自己", "en": "Complete Me", "tag": "Love of Lord Shiva is enormous. Love completes everything.", "tagZh": "濕婆的愛無比廣大,愛使一切圓滿。", "keywords": "愛、圓滿、接納、被支持", "meaning": "你本來就被廣大的愛所包圍。這張牌告訴你,不必等到完美才值得被愛。當你願意接受愛、也給出愛,生命中的缺口便漸漸被填滿。", "extended": "畫面中,濕婆閉目,雙手向上承接,掌心之下是整個地球,象徵愛可以擁抱整個世界,也包含你。\n若你近來感到匱乏或孤單,這張牌邀請你把雙手打開,允許自己接收:被關心、被幫助、被原諒。圓滿來自接納,而不是追求。", "cats": {"work": "以愛與關懷的心態工作,會讓成就更有意義。你不必獨自扛下一切,接受同事的支援也是一種成熟。", "health": "像對待所愛的人一樣善待自己的身體與情緒。休息、被照顧、允許自己脆弱,都是療癒的一部分。", "love": "愛是你的強項,也是你需要被接納的地方。與伴侶坦誠表達需要與感謝。若尚未遇見對象,先把愛給自己,這會成為吸引的基礎。", "family": "家人之間的愛,常被日常瑣事掩蓋。主動說出感謝與關心,也原諒過去的不完美,家會更溫暖。", "social": "以善意對待他人,也允許別人幫助你。給予與接受取得平衡,人際會更加滋潤。", "money": "對金錢不必抱持匱乏感。你是被支持的,資源會在適當的時刻出現。同時學習把一部分分享出去,讓富足流動。", "growth": "練習自我慈悲,對自己說溫柔的話。愛自己不是自私,而是愛這個世界的開始。"}, "img": "images/06-complete-me.jpg", "land": false, "i18n": {"en": {"kw": "Love, completeness, acceptance, being supported", "m": "You have always been surrounded by vast love. This card tells you that you do not have to be perfect to deserve love. When you are willing to receive love and to give it, the gaps in your life gradually fill.", "e": "Shiva, eyes closed, holds both hands upward, and beneath his palms is the whole Earth, symbolizing that love can embrace the world, including you.\nIf you have felt lacking or lonely lately, this card invites you to open your hands and allow yourself to receive: care, help, forgiveness. Completeness comes from acceptance, not from pursuit.", "cats": {"work": "Working with love and care makes achievement more meaningful. You do not have to carry everything alone; accepting help from colleagues is also a form of maturity.", "health": "Treat your body and emotions as you would someone you love. Rest, being cared for and allowing yourself to be vulnerable are all part of healing.", "love": "Love is your strength and also where you need to be accepted. Express your needs and gratitude honestly to your partner. If you have not met someone yet, give love to yourself first; it becomes the foundation of attraction.", "family": "Love among family is often hidden under daily trivia. Say thank you and show care, and forgive past imperfections; home becomes warmer.", "social": "Treat others with kindness and let others help you. When giving and receiving are balanced, relationships are richer.", "money": "You need not hold a sense of scarcity about money. You are supported, and resources will appear at the right time. Also learn to share some of what you have so that abundance keeps flowing.", "growth": "Practice self-compassion and speak to yourself gently. Loving yourself is not selfish; it is the beginning of loving the world."}}}}, {"id": "c07", "no": "7", "name": "小我", "en": "Ego", "tag": "Be conscious. Act as your soul, not your EGO.", "tagZh": "保持覺知,以靈魂行動,而不是以小我行動。", "keywords": "覺知、謙卑、放下我執、以靈魂行動", "meaning": "這張牌提醒你覺察:你現在的反應,是出自靈魂的智慧,還是出自害怕、驕傲、比較或想被認同的小我?先覺察,再行動。", "extended": "畫面中,象頭神雙手合十、低頭接受來自濕婆的祝福之手,象徵謙卑與臣服並不是軟弱,而是為智慧留出空間。\n小我常以「我是對的」「我不能輸」的聲音出現。當你想爭辯或證明自己時,先停一下、深呼吸,問自己:這是靈魂想做的選擇嗎?", "cats": {"work": "留意職場上的爭功、比較與面子問題。放下「我要贏」,專注在共同目標,反而能贏得尊重。願意聆聽回饋,是專業的表現。", "health": "小我可能讓你忽視身體的警訊,或是硬撐。承認自己需要休息或協助,並不丟臉。", "love": "感情裡的冷戰與爭對錯,往往來自小我。比起證明自己是對的,不如問「我們要怎麼一起往前」。誠心的道歉與傾聽,是最有力的語言。", "family": "在家人面前,最容易觸發舊有的模式與自尊。先覺察情緒再回應,放下「我最辛苦」或「你們都不懂我」的敘事。", "social": "留意自己是否過度在意面子、他人評價或想被認同。謙遜與好奇,會讓你更容易被喜歡與信任。", "money": "留意因虛榮、比較或不甘心而做的消費或投資決定。以真實需求與長期規劃為準,不為面子買單。", "growth": "練習每天覺察三次「小我出現的瞬間」,不批判,只是看見它。覺察本身,就是轉化的開始。"}, "img": "images/07-ego.jpg", "land": false, "i18n": {"en": {"kw": "Awareness, humility, letting go of self-importance, acting from the soul", "m": "This card asks you to notice whether your current reaction comes from the wisdom of the soul or from the ego, which is afraid, proud, comparing or wanting approval. Be aware first, then act.", "e": "Ganesha, palms together and head bowed, receives a blessing from Shiva’s hand, symbolizing that humility and surrender are not weakness but space made for wisdom.\nThe ego often speaks as “I am right” or “I cannot lose.” When you want to argue or prove yourself, pause, take a deep breath and ask whether this is the choice your soul would make.", "cats": {"work": "Watch for credit-grabbing, comparison and face-saving at work. Let go of “I must win” and focus on the shared goal; you will earn more respect that way. Being willing to hear feedback is a sign of professionalism.", "health": "The ego can make you ignore your body’s warnings or push through. There is no shame in admitting you need rest or help.", "love": "Cold wars and arguing over who is right in love often come from the ego. Instead of proving yourself right, ask “how do we move forward together?” A sincere apology and attentive listening are the most powerful language.", "family": "Around family, old patterns and pride are easiest to trigger. Notice your emotions before responding, and drop narratives such as “I have it the hardest” or “none of you understand me.”", "social": "Notice whether you care too much about face, others’ opinions or wanting approval. Humility and curiosity make you easier to like and trust.", "money": "Be alert to spending or investing out of vanity, comparison or reluctance to accept a loss. Base decisions on real needs and long-term planning, not on saving face.", "growth": "Practice noticing three moments a day when the ego appears, without judging, just seeing it. Awareness itself is the beginning of transformation."}}}}, {"id": "c08", "no": "8", "name": "業力", "en": "Karma", "tag": "The proper outcome comes from the proper method.", "tagZh": "正確的結果來自正確的方法。", "keywords": "因果、方法、行動、負責", "meaning": "業力即因與果。這張牌提醒你,想要得到好的結果,需要先檢視自己採用的方法與動機。結果不是憑空而來,而是此刻每個選擇的延續。", "extended": "畫面中,兩隻手按在一張繪有蓮花與神獸圖樣的舊紙卷上,像是攤開的計畫或藍圖,象徵「規劃與執行」。\n你也許正在重複某個模式,卻期待不同的結果,此牌建議你停下來調整方法。它同時也提醒:為自己的選擇負責,並相信正直而正確的付出,終究會回到你身上。", "cats": {"work": "檢視工作流程與溝通方式:哪些做法一直造成同樣的問題?調整方法、釐清責任、做好準備,成果會更好。誠信與品質,是長期的資本。", "health": "目前的身心狀態,與過往的生活習慣相連。從睡眠、飲食、運動與壓力的處理開始調整,是最直接的「正確方法」。", "love": "關係的現況,是雙方互動模式累積的結果。若想改變,先調整自己的溝通與回應方式,而不是等待對方改變。真誠與尊重,會帶來好的回應。", "family": "家庭中反覆出現的衝突,往往有固定的模式。找出模式,嘗試不同的互動方式,同時學習為自己的言行負責。", "social": "你怎麼對待人,人際就怎麼回應你。以誠信、守時與善意經營關係,會逐漸累積好的人緣。", "money": "理財要靠正確的方法:記帳、預算、風險評估與長期規劃。避開灰色地帶與投機的路,正當的途徑才能長久。", "growth": "回顧自己近期的選擇與其結果,看見因果,並設定一個新的習慣來取代舊的模式。"}, "img": "images/08-karma.jpg", "land": false, "i18n": {"en": {"kw": "Cause and effect, method, action, responsibility", "m": "Karma is cause and effect. This card reminds you that to get a good result you must first examine your methods and motives. Results do not appear from nowhere; they are the continuation of every choice you make now.", "e": "Two hands rest on an old scroll painted with a lotus and a mythical beast, like an unrolled plan or blueprint, symbolizing “planning and execution.”\nYou may be repeating a pattern while expecting a different result; this card suggests you pause and adjust your method. It also reminds you to take responsibility for your choices and trust that upright, correct effort will eventually return to you.", "cats": {"work": "Review your workflow and communication: which practices keep causing the same problem? Adjust methods, clarify responsibilities and prepare well, and results improve. Integrity and quality are long-term capital.", "health": "Your current state of body and mind is linked to past habits. Adjusting sleep, diet, exercise and how you handle stress is the most direct “correct method.”", "love": "The state of a relationship is the accumulated result of how two people interact. To change it, adjust your own communication and responses instead of waiting for the other to change. Sincerity and respect bring good responses.", "family": "Recurring conflicts at home usually follow a fixed pattern. Find the pattern, try a different way of interacting, and learn to take responsibility for your own words and actions.", "social": "How you treat people is how people respond to you. Build relationships with honesty, punctuality and goodwill, and good rapport accumulates.", "money": "Managing money relies on correct methods: bookkeeping, budgets, risk assessment and long-term planning. Avoid gray areas and speculation; legitimate routes last.", "growth": "Review your recent choices and their consequences, see the cause and effect, and set a new habit to replace the old pattern."}}}}, {"id": "c09", "no": "9", "name": "悲傷療癒", "en": "Grief Management", "tag": "Giving your pains a voice. Feel it and let it go.", "tagZh": "讓你的痛苦有聲音,感受它,然後放下。", "keywords": "悲傷、釋放、哀悼、允許感受", "meaning": "悲傷需要被看見。這張牌邀請你不要壓抑痛苦,而是讓它有聲音:哭、說、寫、被陪伴,都是通往釋放的方式。感受過了,才能真正放下。", "extended": "畫面在烈焰與閃電之中,濕婆懷抱著所愛之人,仰頭釋放痛楚。連神也有悲傷,而祂選擇完整地經歷它。\n哀悼沒有時間表,不必急著「好起來」。你可以向信任的人傾訴,或用書寫、藝術與儀式表達。若悲傷持續深重、影響日常生活,請尋求專業心理協助。", "cats": {"work": "工作中的失落,例如失業、專案失敗、合作中斷,都需要時間消化。允許自己難過、適當休息,再重新出發,會比硬撐更有後勁。", "health": "長期壓抑情緒,可能反映在身體上,如疲憊、失眠、緊繃。讓情緒有出口,必要時尋求專業諮商或醫療協助,那是照顧自己,不是軟弱。", "love": "面對關係的結束或失落,給自己哀悼的空間。不急著進入新關係,也不強迫自己立刻釋懷。在關係中,也可以坦誠說出自己的傷與需要。", "family": "家庭裡可能有未被說出的傷痛或失去。找一個安全的時刻一起談談、一起紀念,讓悲傷成為連結,而不是距離。", "social": "向值得信任的朋友打開心,讓人陪伴你。你不需要在每個人面前都堅強,也可以暫時退出社交,整理自己。", "money": "面對經濟上的損失或遺憾,先接納情緒,再理性評估。不要在情緒最低潮時做重大的財務決定,等心情較平穩再行動。", "growth": "練習與痛苦同在:觀察它在身體的哪裡、有什麼形狀,不推開也不放大。放下,是在充分感受之後自然發生的。"}, "img": "images/09-grief-management.jpg", "land": false, "i18n": {"en": {"kw": "Grief, release, mourning, allowing feeling", "m": "Grief needs to be seen. This card invites you not to suppress pain but to give it a voice: crying, speaking, writing or being accompanied are all ways toward release. Only after feeling can you truly let go.", "e": "Amid flames and lightning, Shiva holds a loved one and tilts his head back to release his pain. Even a god grieves, and he chooses to go through it fully.\nMourning has no timetable and you need not rush to “feel better.” You can confide in someone you trust, or express it through writing, art and ritual. If grief stays heavy and affects daily life, please seek professional psychological support.", "cats": {"work": "Losses at work, such as losing a job, a failed project or a broken partnership, take time to process. Allow yourself to feel sad and rest properly before starting again; it gives more staying power than forcing yourself on.", "health": "Long-suppressed emotions can show up in the body as fatigue, insomnia or tension. Give feelings an outlet, and seek professional counseling or medical help when needed; that is caring for yourself, not weakness.", "love": "When a relationship ends or you face loss, give yourself room to mourn. Do not rush into a new relationship or force yourself to be over it. Within a relationship you can also speak openly about your hurt and needs.", "family": "There may be unspoken pain or loss in the family. Find a safe moment to talk and remember together, so grief becomes a connection rather than a distance.", "social": "Open your heart to friends you trust and let them keep you company. You do not need to be strong in front of everyone, and you can step back from socializing for a while to gather yourself.", "money": "After financial loss or regret, accept your feelings first, then assess rationally. Do not make major financial decisions at your lowest emotional point; act once you are steadier.", "growth": "Practice staying with pain: notice where it sits in the body and what shape it has, neither pushing it away nor magnifying it. Letting go happens naturally after full feeling."}}}}, {"id": "c10", "no": "10", "name": "時機", "en": "Timing", "tag": "Be patient. Trust the process of life.", "tagZh": "保持耐心,信任生命的歷程。", "keywords": "耐心、時機、信任、順勢", "meaning": "萬事皆有其時。這張牌請你放慢對結果的焦慮,在該等待時安心等待,在機會出現時準備好行動。相信生命有它自己的節奏。", "extended": "畫面中,一位女子在老虎的陪伴下靜坐祈禱,身旁是燃燒的火壇與散落的花瓣,安然與力量並存。\n耐心不是被動等待,而是在等待中持續修煉與準備。若你正感到「怎麼還沒發生」,回頭看看:自己能做的部分,是否都已經做到?剩下的,交給時間。", "cats": {"work": "重要的升遷、轉職或合作,時機尚未成熟時,先累積實力與人脈。不必倉促決策,但機會來臨時要有所準備。", "health": "身體的恢復與調養需要時間,不要因為進度慢而焦慮或放棄。維持良好的生活習慣,讓身體以自己的步調復原。", "love": "緣分有它的時機。不必急著定義或下結論,給彼此時間觀察與培養。單身者保持開放與自愛,不為了「快點有伴」而將就。", "family": "家庭的課題,如溝通、決策、關係修復,需要時間醞釀。避免在情緒緊繃時逼迫結論,等待適當的時機再談。", "social": "好的關係靠時間檢驗。不用強求與每個人立刻熟絡,讓信任自然累積。", "money": "投資與大額決策要留意時機,避免因焦慮而追高殺低。長期持有、耐心等待,通常優於頻繁進出。", "growth": "學習在「等待」中保持穩定:呼吸、觀察、持續做日常功課。相信此刻的過程,正在為你鋪路。"}, "img": "images/10-timing.jpg", "land": false, "i18n": {"en": {"kw": "Patience, timing, trust, going with the flow", "m": "Everything has its time. This card asks you to ease your anxiety about results, wait calmly when it is time to wait, and be ready to act when an opportunity appears. Trust that life has its own rhythm.", "e": "A woman sits praying with a tiger beside her, next to a burning fire altar and scattered petals, calm and power together.\nPatience is not passive waiting but continued practice and preparation while you wait. If you are wondering “why hasn’t it happened yet,” look back and ask whether you have done everything within your control. Leave the rest to time.", "cats": {"work": "When a promotion, job change or partnership is not yet ripe, build skills and connections first. Do not decide in haste, but be ready when the opportunity comes.", "health": "Recovery and recuperation take time; do not become anxious or give up because progress is slow. Keep good habits and let the body heal at its own pace.", "love": "Affinity has its own timing. Do not rush to define things or reach conclusions; give each other time to observe and grow. If you are single, stay open and kind to yourself and do not settle just to “have someone soon.”", "family": "Family issues such as communication, decisions and repairing relationships need time to ripen. Avoid forcing conclusions when emotions run high; wait for a better moment to talk.", "social": "Good relationships are tested by time. Do not force instant closeness with everyone; let trust accumulate naturally.", "money": "Mind the timing of investments and large decisions, and avoid buying high and selling low out of anxiety. Holding for the long term and waiting patiently usually beats frequent trading.", "growth": "Learn to stay steady while waiting: breathe, observe, keep up daily practice. Trust that the present process is paving the way for you."}}}}, {"id": "c11", "no": "11", "name": "挑戰", "en": "Challenge", "tag": "You're STRONG enough & You're NOT ALONE.", "tagZh": "你足夠強大,而且你並不孤單。", "keywords": "勇氣、力量、不孤單、面對困難", "meaning": "困難來臨時,這張牌要你記住兩件事:你比自己以為的更強,而且你並不孤單。挑戰不是來打倒你的,是來讓你看見自己還沒用上的力量。", "extended": "畫面中,多臂的女神在火光與風雪裡揮舞利刃,氣勢逼人,而一隻堅定的手穩穩地伸向她,象徵力量與支持同時存在。\n面對難關時,不必假裝無所畏懼,也不必獨自硬撐。承認害怕、開口求援,是勇敢的一部分。想想:這次我可以向誰借力?又可以用什麼方式,把壓力轉成前進的動力?", "cats": {"work": "職場上的難關,是檢驗與長出實力的機會。把大問題拆成幾個小步驟,主動向前輩、同事或主管求助,你會發現自己並不孤單,也比預期更有辦法。", "health": "身心承受著壓力時,別一個人扛。把感受說出來,安排休息,必要時尋求專業協助。照顧好自己的力氣,才有力氣面對挑戰。", "love": "關係出現考驗時,先相信你們有能力一起度過。誠實說出困難與需要,面對衝突而不逃避,能讓關係更深。", "family": "家中若有壓力或爭執,別覺得是你一個人的責任。邀請家人一起分擔,明確說出你需要什麼幫助。", "social": "你正面對的人際壓力,不是只有你在承受。找到值得信任的人談談,你會得到支持,也可能發現別人也有類似的處境。", "money": "面對財務壓力,先看清全貌,再擬定具體可行的計畫。向可靠的人或專業人士諮詢,不要因羞愧而獨自承擔。", "growth": "把眼前的挑戰視為成長的邀請。回想過去撐過來的經驗,提醒自己:我曾經做到,現在也可以。"}, "img": "images/11-challenge.jpg", "land": false, "i18n": {"en": {"kw": "Courage, strength, not alone, facing difficulty", "m": "When hard times come, this card asks you to remember two things: you are stronger than you think, and you are not alone. Challenges do not come to defeat you; they come to show you strength you have not yet used.", "e": "A many-armed goddess wields blades amid firelight and snowstorm, formidable, while a steady hand reaches out firmly toward her, symbolizing strength and support existing together.\nWhen facing difficulty you need not pretend to be fearless, nor carry it alone. Admitting fear and asking for help are part of courage. Ask yourself: whom can I lean on this time, and how can I turn this pressure into forward motion?", "cats": {"work": "Difficulties at work are chances to test and build your ability. Break the big problem into small steps and ask seniors, colleagues or your manager for help; you will find you are not alone and have more resources than expected.", "health": "When body and mind are under stress, do not carry it alone. Say what you feel, schedule rest, and seek professional help when needed. Caring for your strength gives you strength to face the challenge.", "love": "When a relationship is tested, first believe you can get through it together. Name the difficulty and your needs honestly and face conflict instead of avoiding it; it can deepen the bond.", "family": "If there is stress or quarreling at home, do not assume it is yours alone to carry. Invite family to share the load and say clearly what help you need.", "social": "The social pressure you face is not borne by you alone. Talk with someone you trust; you will receive support and may find others in similar situations.", "money": "Facing financial pressure, see the whole picture first, then make a concrete, workable plan. Consult a reliable person or professional rather than carrying it alone out of shame.", "growth": "See today’s challenge as an invitation to grow. Recall past times you made it through and remind yourself: I did it before, and I can do it now."}}}}, {"id": "c12", "no": "12", "name": "同行", "en": "Together", "tag": "One uses intuition as a compass. Using wisdom as a vehicle toward the journey.", "tagZh": "以直覺作為羅盤,以智慧作為前往旅程的載具。", "keywords": "同行、家人、直覺、智慧、合作", "meaning": "人生的旅程不是一個人走的。這張牌提醒你,用直覺辨別方向,用智慧選擇方法,並珍惜與你同行的人。方向與方法都有了,再多的路也能走得安穩。", "extended": "畫面中,濕婆與伴侶、兩位孩子,連同孔雀與小老鼠聚在一起,氣氛輕鬆而親近,象徵家庭與同伴間的溫暖相伴。\n直覺像羅盤,告訴你要往哪裡去;智慧像載具,決定你如何抵達。兩者缺一不可。也請想想:此刻誰在陪你前行?你是否好好感謝了他們?", "cats": {"work": "善用團隊的力量:你的直覺看見方向,同事的專長補上方法。分工合作、彼此信任,比單打獨鬥走得更遠。做重大決定時,同時參考感覺與資料。", "health": "身心狀態可以與家人或夥伴一起照顧:一起散步、一起用餐、互相提醒休息。同時參考身體的直覺感受與專業建議,找到適合你的方式。", "love": "兩個人同行,需要共同的方向與各自的空間。聊聊彼此對未來的想像,一起做決定,也尊重對方的步調。這是適合經營親密關係的時刻。", "family": "這是很適合安排家庭相聚的時刻。花時間在一起,用輕鬆的方式交流,讓家人感到被在乎。家中大事,以愛與智慧共同商量。", "social": "身邊有同行的朋友與夥伴。珍惜彼此支持的關係,也願意加入有共同目標的團體,在合作中成長。", "money": "財務規劃適合與家人或伴侶一起討論,建立共同的目標與預算。以直覺感受需求,以智慧做出理性安排。", "growth": "學習同時信任直覺與理性。也留意身邊願意陪你成長的人,與他們分享旅程,會讓成長更有力量。"}, "img": "images/12-together.jpg", "land": false, "i18n": {"en": {"kw": "Together, family, intuition, wisdom, cooperation", "m": "Life’s journey is not walked alone. This card reminds you to read direction by intuition, choose methods by wisdom, and cherish those who travel with you. With direction and method in hand, any road can be walked steadily.", "e": "Shiva, his consort and two children gather with a peacock and a little mouse, relaxed and close, symbolizing the warmth of family and companions.\nIntuition is a compass that tells you where to go; wisdom is a vehicle that decides how you arrive. You need both. Also ask: who is traveling with you right now, and have you thanked them?", "cats": {"work": "Use the strength of your team: your intuition sees the direction and colleagues’ expertise supplies the method. Dividing work and trusting each other takes you farther than going solo. For major decisions, consult both your feelings and the data.", "health": "Care for body and mind together with family or companions: walk together, eat together, remind each other to rest. Consider both your body’s intuition and professional advice to find what suits you.", "love": "Two people traveling together need a shared direction and their own space. Talk about your visions for the future, decide together and respect each other’s pace. A good time to nurture intimacy.", "family": "A very good time to arrange a family gathering. Spend time together, communicate in relaxed ways and let family feel cared for. Discuss big family matters with love and wisdom.", "social": "There are friends and partners walking with you. Cherish mutual support and consider joining a group with shared goals; you grow through cooperation.", "money": "Plan finances together with family or your partner, setting shared goals and budgets. Sense needs by intuition, and make arrangements by reason.", "growth": "Learn to trust both intuition and reason. Notice who is willing to grow with you; sharing the journey makes growth more powerful."}}}}, {"id": "c13", "no": "13", "name": "平等", "en": "Equality", "tag": "Like other beings or things, you are equally a part of the universe.", "tagZh": "如同其他眾生與萬物,你也平等地是宇宙的一部分。", "keywords": "平等、不比較、共舞、歸屬", "meaning": "你不比任何人更高,也不比任何人更低。這張牌提醒你,每個存在都是宇宙的一部分,不需要靠比較來證明價值。放下高低之分,才能真正與世界共舞。", "extended": "畫面中,兩位神祇在滿月之下並肩起舞,彼此呼應,沒有誰在誰之上。\n當你覺得自己不如別人時,或是不自覺地輕視別人時,都可以回到這張牌:我們都是同一片宇宙的一部分。也可以問問自己:我是否在某些關係裡,把自己放得太低,或太高?", "cats": {"work": "職場上放下階級與比較的心態:尊重每個角色的貢獻,無論職位高低。你也不需要因為資歷較淺而覺得自己不夠格發言。", "health": "別用別人的標準衡量自己的身體與狀態。每個人的節奏與體質不同,接納自己的樣子,是健康的起點。", "love": "健康的關係建立在平等之上:互相尊重、分擔、聆聽。留意是否有一方長期居於主導或遷就,試著重新調整成對等的相處。", "family": "家庭中的每個人,不論年齡與角色,都值得被尊重與聆聽。給孩子與長輩都有表達意見的空間。", "social": "對待每個人保持平等的善意,不因身分、地位或條件而改變態度。你也值得被同樣尊重,別因自卑而退縮。", "money": "別為了比較而消費或投資。金錢上的富足不是與他人比誰多,而是讓自己與家人安穩、自在。", "growth": "練習在日常中看見自己與他人的相同之處。當你感覺與萬物相連,孤獨與比較心就會慢慢淡去。"}, "img": "images/13-equality.jpg", "land": false, "i18n": {"en": {"kw": "Equality, no comparison, dancing together, belonging", "m": "You are not higher or lower than anyone. This card reminds you that every being is part of the universe and needs no comparison to prove its worth. Let go of high and low, and you can truly dance with the world.", "e": "Two deities dance side by side beneath a full moon, echoing each other, neither above the other.\nWhen you feel inferior, or find yourself looking down on someone, return to this card: we are all part of the same universe. Ask yourself, in which relationships do I place myself too low, or too high?", "cats": {"work": "At work, drop the mindset of rank and comparison: respect every role’s contribution regardless of title. You also need not feel unqualified to speak up just because you are junior.", "health": "Do not measure your body and condition by other people’s standards. Everyone’s rhythm and constitution differ; accepting yourself as you are is the start of health.", "love": "Healthy relationships rest on equality: mutual respect, shared load and listening. Notice whether one side always leads or always yields, and try to rebalance into a peer relationship.", "family": "Everyone in the family, regardless of age or role, deserves respect and a hearing. Give both children and elders room to speak.", "social": "Treat everyone with equal goodwill, regardless of status or circumstances. You deserve the same respect; do not shrink back out of low self-worth.", "money": "Do not spend or invest to compare. Financial abundance is not about having more than others but about making yourself and your family secure and at ease.", "growth": "Practice seeing what you share with others in daily life. When you feel connected to everything, loneliness and comparison fade."}}}}, {"id": "c14", "no": "14", "name": "無時間之境", "en": "Timeless Space", "tag": "Going deeper and deeper. Be free from time constraints.", "tagZh": "愈來愈深入,從時間的限制中自由。", "keywords": "無時間、深入、自由、冥想", "meaning": "這張牌邀請你暫時離開時鐘的節奏,往內在更深處去。當你不再被「來不來得及」追著跑,會發現有一個無須趕路、無須證明的空間,一直在那裡。", "extended": "畫面中,一個白色身影在星雲般的宇宙中輕輕漂浮,四周沒有上下,也沒有時間的刻度。\n這是冥想與深度休息的意象。若你常覺得時間不夠用,請試著安排一段不看時間、不被打擾的時光:靜坐、泡澡、散步都可以。深入的過程不用急,愈慢,愈深。", "cats": {"work": "時間壓力很大時,先停下來,給自己一小段不被打斷的專注時間。把最重要的事情放在這段時間處理,比分心趕工更有效率。", "health": "深度的休息與放鬆對身心很重要。嘗試靜坐、深呼吸或睡前放下手機,讓身體進入真正的休息狀態。", "love": "與伴侶共處時,放下手機與行程,專心陪伴彼此。有品質的在場,比長時間的相處更能拉近距離。", "family": "和家人相處不必急著安排活動,可以只是靜靜待在一起。放慢步調,讓家裡有一點留白與安靜的空間。", "social": "不必被社交節奏牽著走。給自己獨處的時間,回來時你會有更多能量與人相處。", "money": "別被「錯過」的焦慮推著做決定。對於重要的財務選擇,給自己足夠的時間思考,不被限時優惠或他人催促左右。", "growth": "建立固定的靜心習慣,即使每天只有十分鐘。在無時間的空間裡,你會更靠近真實的自己。"}, "img": "images/14-timeless-space.jpg", "land": true, "i18n": {"en": {"kw": "Timelessness, going deeper, freedom, meditation", "m": "This card invites you to step away from the clock’s rhythm and go deeper within. When you are no longer chased by “will I make it in time,” you find a space that needs no hurrying and no proving, and has always been there.", "e": "A white figure floats gently in a nebula-like cosmos, with no up or down and no marks of time.\nThis is an image of meditation and deep rest. If time always feels short, set aside a stretch that is clock-free and undisturbed: sitting quietly, a bath or a walk will do. Going deep need not be rushed; the slower, the deeper.", "cats": {"work": "Under heavy time pressure, stop first and give yourself a short interruption-free block. Handle the most important thing in it; it is more effective than rushing while distracted.", "health": "Deep rest and relaxation matter for body and mind. Try sitting quietly, deep breathing, or putting your phone away before bed so the body can truly rest.", "love": "With your partner, put away phones and schedules and be fully present. Quality presence brings you closer than long hours together.", "family": "With family you need not rush to plan activities; just being quietly together is enough. Slow the pace and leave some white space and quiet at home.", "social": "You need not be led by the social rhythm. Give yourself time alone; you will return with more energy for people.", "money": "Do not let fear of missing out drive your decisions. For important financial choices, give yourself enough time to think and do not be swayed by limited-time offers or pressure from others.", "growth": "Build a regular quiet-mind habit, even ten minutes a day. In the timeless space you come closer to your true self."}}}}, {"id": "c15", "no": "15", "name": "紮根", "en": "Grounding", "tag": "Connecting with your roots. Release negativity to the ground.", "tagZh": "與你的根連結,把負面的能量釋放給大地。", "keywords": "紮根、接地、釋放、穩定", "meaning": "當心神不寧、想太多或情緒翻騰時,這張牌請你回到大地。想像自己如樹木般紮根,把緊繃與雜念交給土地,留下穩定與清明。", "extended": "畫面中,濕婆在山崖上以單腳站立、雙手合於頭頂,背景是蓊鬱的森林與瀑布,展現穩固與平衡。\n紮根可以很簡單:赤腳踩在草地上、慢慢深呼吸、感受腳底與地面接觸。也可以回頭看看:你的根在哪裡?是家人、價值觀、故鄉,還是某個重要的信念?與它們連結,會讓你更穩。", "cats": {"work": "在忙亂的工作中,先穩住自己的節奏。列出最重要的三件事,一次專注一件,不被雜訊帶著走。", "health": "多接觸自然:到戶外走走、赤腳踩踩草地、深呼吸。規律作息與穩定飲食,也是一種讓身體紮根的方式。", "love": "在感情中穩住自己,別被不安全感牽著走。先安頓好自己的情緒,再與對方溝通,關係會更踏實。", "family": "回到家的根源,與家人一起做熟悉的事:一頓家常飯、回老家、聊聊從前。這些會帶來安定與歸屬感。", "social": "穩穩地做自己,不被他人的情緒帶走。遇到負面的互動,事後給自己時間釋放與放下。", "money": "財務上穩紮穩打:建立緊急預備金、檢視基本開銷。踏實的基礎比高報酬更讓人安心。", "growth": "每天花幾分鐘觀察呼吸與身體的感覺,把注意力帶回此時此地。紮根是一種練習,不是一次完成。"}, "img": "images/15-grounding.jpg", "land": true, "i18n": {"en": {"kw": "Grounding, stability, release, steadiness", "m": "When your mind is restless, overthinking or churning with emotion, this card asks you to return to the earth. Imagine yourself rooted like a tree, giving tension and clutter to the soil and keeping steadiness and clarity.", "e": "Shiva stands on one leg on a cliff with palms joined overhead, with lush forest and a waterfall behind, showing stability and balance.\nGrounding can be simple: stand barefoot on grass, breathe slowly, feel the soles meeting the ground. You can also ask: where are my roots? Family, values, hometown or a core belief? Connecting with them steadies you.", "cats": {"work": "In the rush of work, steady your own rhythm first. List the three most important things and focus on one at a time without being pulled by noise.", "health": "Spend time in nature: walk outdoors, stand barefoot on grass, breathe deeply. A regular routine and steady diet are also ways of rooting the body.", "love": "Steady yourself in love and do not be pulled around by insecurity. Settle your own emotions first, then talk with your partner; the relationship becomes more solid.", "family": "Return to your family roots and do familiar things together: a home-cooked meal, a visit to the old home, talking about the past. These bring stability and belonging.", "social": "Be yourself steadily and do not be carried off by others’ emotions. After a negative interaction, give yourself time to release and let go.", "money": "Be steady in finances: build an emergency fund and review basic expenses. A solid base brings more peace of mind than high returns.", "growth": "Spend a few minutes a day observing your breath and body, bringing attention back to here and now. Grounding is a practice, not a one-time act."}}}}, {"id": "c16", "no": "16", "name": "平靜", "en": "Calm", "tag": "Retreat to effectively recharge.", "tagZh": "適度退下來,才能有效地充電。", "keywords": "平靜、休息、充電、獨處", "meaning": "退後一步,不是逃避,而是為了更有力地前進。這張牌告訴你,現在是需要停下來、補充能量的時候。有效的充電,會讓之後的行動事半功倍。", "extended": "畫面中,一個身影背對我們,靜靜坐在岩石上望向黃昏的海面,遠方雲霞柔和,海浪不斷拍打,卻不打擾內心的平靜。\n如果你最近很累,請不要再責備自己「不夠努力」。安排一段真正屬於自己的獨處時間:離開人群與訊息,面對一片海、一座山,或只是一個安靜的房間。", "cats": {"work": "工作疲累時,適度請假或調整工作量,別硬撐。短暫的暫停能讓你回來時更有效率,也避免倦怠。", "health": "這是需要好好休息的提醒。補足睡眠、減少刺激、放慢步調,讓身心有機會恢復
