。若長期疲憊,請安排專業的健康檢查。", "love": "關係中需要一些獨處的空間,並不代表疏遠。彼此給予空間、各自充電,再回來相聚,感情反而更穩定。", "family": "家庭中負擔很重時,學會請家人分擔,也讓自己有暫停的時間。你好好休息,才有力氣照顧家人。", "social": "不必勉強參加每一場聚會。篩選真正重要的互動,留一些時間給自己,是對自己與他人都誠實的做法。", "money": "暫停大額的投資與消費決定。在平靜的心境下,看得更清楚,決策也會更理性。", "growth": "每天保留一小段「什麼都不做」的時間,讓心像海面一樣慢慢沉澱,能量會自然回來。"}, "img": "images/16-calm.jpg", "land": true, "i18n": {"en": {"kw": "Calm, rest, recharge, solitude", "m": "Stepping back is not escape but a way to move forward more strongly. This card says now is a time to stop and replenish energy. Effective recharging makes later action twice as effective for half the effort.", "e": "A figure with their back to us sits quietly on a rock looking at the dusk sea, soft clouds in the distance, waves ceaselessly beating yet not disturbing the inner calm.\nIf you have been very tired lately, stop blaming yourself for “not trying hard enough.” Arrange time that is truly your own, away from crowds and messages, facing the sea, a mountain, or just a quiet room.", "cats": {"work": "When work is exhausting, take leave or adjust your workload instead of forcing through. A short pause makes you more efficient on return and prevents burnout.", "health": "A reminder that you need good rest. Get enough sleep, reduce stimulation and slow down so body and mind can recover. If you are tired for a long time, arrange a professional health check.", "love": "Needing some solitude in a relationship does not mean distance. Give each other space to recharge and come back together; the bond becomes steadier.", "family": "When the load at home is heavy, learn to ask family to share it and give yourself pauses. Only when you rest well can you care for others.", "social": "You need not force yourself to attend every gathering. Choosing the interactions that truly matter and keeping time for yourself is honest to you and to others.", "money": "Pause large investment and spending decisions. In a calm state you see more clearly and decide more rationally.", "growth": "Keep a little “do nothing” time each day and let the mind settle slowly like the sea surface; energy returns naturally."}}}}, {"id": "c17", "no": "17", "name": "自由", "en": "Free", "tag": "Loosen your grip so you are free to go everywhere.", "tagZh": "鬆開你的緊握,這樣你就能自由地前往任何地方。", "keywords": "自由、放手、輕盈、鬆開", "meaning": "我們常常因為抓得太緊,才失去了自由。這張牌請你想想:是什麼讓你緊握不放?當你願意鬆開,你就能輕盈地去往任何方向。", "extended": "畫面中,一個身影在雲海的漩渦之上輕柔地向後伸展,身體柔軟而放鬆,四周是無邊的天空與海洋。\n緊握可能是對結果的執著、對人的控制、對過去的不捨。放手不是放棄,而是相信自己無論如何都能站穩。也問問自己:如果放下這件事,我會得到什麼樣的自由?", "cats": {"work": "放下對完美與掌控的執著,學著授權與信任團隊。也不妨重新思考:是否有某個職位或習慣,其實在限制你的發展?", "health": "緊繃的身體需要被放鬆。練習伸展、深呼吸,留意肩頸與下巴是否一直用力。放鬆的身體,也會帶來放鬆的心。", "love": "在關係中放下控制與猜疑,給對方也給自己空間。愛不是緊抓,而是讓彼此自由地選擇靠近。若有一段已經結束的感情,也許是時候放手了。", "family": "試著放下對家人的期待與掌控,尊重每個人走自己的路。放手,反而讓關係更靠近。", "social": "不必緊抓住某種形象或舊有的圈子。你有權利離開讓你不舒服的關係,也有自由結識新的朋友。", "money": "放下對金錢過度的焦慮與計較,同時也檢視是否被負債、舊有的消費習慣綁住。逐步整理,才能真正得到財務上的自由。", "growth": "寫下你正在緊握的三件事,然後問自己:哪一個我可以先鬆開一點?練習一次一點點放手。"}, "img": "images/17-free.jpg", "land": true, "i18n": {"en": {"kw": "Freedom, letting go, lightness, loosening", "m": "We often lose freedom because we hold on too tightly. This card asks what you are gripping. When you are willing to loosen, you can go lightly in any direction.", "e": "A figure stretches gently backward above a swirl of clouds, body soft and relaxed, surrounded by boundless sky and sea.\nGripping may be attachment to an outcome, control over people, or reluctance to leave the past. Letting go is not giving up; it is trusting you can stand firm whatever happens. Ask yourself: if I let go of this, what freedom would I gain?", "cats": {"work": "Let go of attachment to perfection and control, and learn to delegate and trust the team. Also reconsider whether a particular role or habit is actually limiting your growth.", "health": "A tense body needs relaxing. Practice stretching and deep breathing, and notice whether your shoulders, neck and jaw are constantly clenched. A relaxed body brings a relaxed mind.", "love": "Release control and suspicion in relationships, giving space to your partner and yourself. Love is not clinging but letting each other freely choose closeness. If a relationship has already ended, it may be time to let go.", "family": "Try letting go of expectations and control over family, respecting each person’s own path. Letting go often brings you closer.", "social": "You need not cling to an image or an old circle. You have the right to leave relationships that make you uncomfortable and the freedom to meet new friends.", "money": "Let go of excess anxiety and fussing over money, and also check whether debt or old spending habits are tying you down. Sort things out step by step to gain real financial freedom.", "growth": "Write down three things you are gripping, then ask which one you can loosen a little first. Practice letting go a bit at a time."}}}}, {"id": "c18", "no": "18", "name": "生命", "en": "Life", "tag": "Be(ware) the fire.", "tagZh": "成為那團火,也覺察那團火。", "keywords": "生命力、熱情、火焰、覺察、親密", "meaning": "火是生命的能量,能溫暖、能創造,也可能灼傷。「Be(ware)」是一個雙關:既是「成為」那團火,也是「覺察、當心」它。這張牌邀請你熱情地活著,同時清醒地掌握自己的力量。", "extended": "畫面中,兩個身影在蓮花之上緊緊相擁,背後是絢爛如煙火的星空,象徵陰陽能量交融所創造出的生命。\n你近來是否感受到某種強烈的渴望、熱情或衝動?那是生命力的展現,值得被看見。也請留意:當情緒或慾望過熱時,先覺察它,再決定如何運用。讓火成為照亮與溫暖的力量,而不是燒盡一切的力量。", "cats": {"work": "你的熱情與衝勁是最大的資本,適合投入有意義的創作或專案。但也要留意過度燃燒,學會分配精力,避免倦怠。", "health": "生命力旺盛的時期,可以好好運動與活動身體,也要留意作息與飲食的節制,避免過度消耗。若有發炎、上火等不適,請諮詢專業人員。", "love": "感情中有強烈的吸引力與熱度。珍惜這份親密,同時以尊重與真誠相待,覺察自己的情緒與慾望,避免讓衝動主導。", "family": "家中的能量也許有些「火熱」,例如急躁、爭執。先覺察情緒,再溝通,把火氣轉成對家人真誠的關心。", "social": "你的熱情會吸引周圍的人,也可能不小心灼傷別人。以善意與分寸表達想法,讓影響力成為溫暖的光。", "money": "財務上有想積極行動的衝動,例如大額消費或投資。先冷靜評估風險,再決定。熱情要搭配謹慎。", "growth": "觀察自己內在的「火」:是什麼點燃了你?什麼又讓你耗盡?學著與這股能量共處,讓它成為生命的動力。"}, "img": "images/18-life.jpg", "land": true, "i18n": {"en": {"kw": "Vitality, passion, fire, awareness, intimacy", "m": "Fire is the energy of life: it can warm, create, and also burn. “Be(ware)” is a pun: to be the fire, and to be aware of it. This card invites you to live passionately while staying clear about your own power.", "e": "Two figures embrace tightly on a lotus, with a starry sky like fireworks behind, symbolizing life created by the blending of yin and yang energy.\nHave you felt a strong longing, passion or impulse lately? That is life force showing itself and deserves to be seen. Also notice: when emotion or desire runs hot, be aware of it first, then decide how to use it. Let fire be a force that lights and warms, not one that burns everything.", "cats": {"work": "Your passion and drive are your greatest capital, suited to meaningful creative work or projects. But watch for burning out: learn to distribute your energy.", "health": "A time of strong vitality for exercise and activity, but moderate your routine and diet to avoid overspending your energy. For inflammation or “heatiness” complaints, consult a professional.", "love": "There is strong attraction and heat in love. Cherish the intimacy while treating each other with respect and sincerity, and be aware of your emotions and desires so impulse does not take the lead.", "family": "The energy at home may be “hot,” such as impatience or arguments. Notice your emotions first, then communicate, turning heat into sincere care for family.", "social": "Your passion attracts people and may also scorch someone by accident. Express your views with kindness and tact so your influence is a warm light.", "money": "You may feel an urge to act boldly with money, such as big spending or investment. Cool down and assess the risks first. Pair passion with caution.", "growth": "Observe your inner “fire”: what ignites you and what drains you? Learn to live with this energy and let it become the drive of your life."}}}}, {"id": "c19", "no": "19", "name": "皈敬濕婆", "en": "Om Namah Shivaya", "tag": "I offer Lord Shiva my deepest respect and devotion.", "tagZh": "我向濕婆獻上我最深的敬意與奉獻。", "keywords": "敬意、奉獻、咒語、信任、臣服", "meaning": "「嗡那摩濕婆耶」是向濕婆致敬的咒語。這張牌邀請你以謙卑與真誠的心,把自己交託給比自己更大的力量,並相信你被守護、被引領。", "extended": "畫面中,一隻結著手印的手重疊在幾何圖形之上,背景是層層疊疊的梵文咒語,象徵聲音、符號與意念合一。\n反覆誦念咒語,可以幫助心安定下來,不再被雜念牽動。當你感到無力或迷惘時,可以安靜地默念這句話,同時問自己:我是否願意放下掌控,信任生命的安排?", "cats": {"work": "以敬業與感恩的心看待工作。做你該做的事,不過度執著於結果。需要幫助或指引時,也願意向前輩請益。", "health": "規律的靜心或誦念能讓身心穩定。可以每天花幾分鐘,輕聲念誦或靜靜呼吸,幫助神經系統放鬆。", "love": "在感情中以尊重與感謝對待彼此。把對方視為值得敬重的人,而不是需要改造的對象,關係會更深厚。", "family": "對家人懷著感恩與尊敬,尤其是長輩。一個真誠的問候,或一起進行簡單的祈福儀式,能讓家更和諧。", "social": "以謙卑與尊重面對每個人。你不需要控制別人怎麼看你,專注在真誠與善意上即可。", "money": "以感恩與知足的態度看待財富。取之有道、用之有度,把一部分分享給需要的人,財富會更加流動。", "growth": "找到屬於你的靜心儀式,例如誦念、祈禱、冥想。重複的練習能培養信任與內在的穩定。"}, "img": "images/19-om-namah-shivaya.jpg", "land": false, "i18n": {"en": {"kw": "Respect, devotion, mantra, trust, surrender", "m": "“Om Namah Shivaya” is a mantra of reverence to Shiva. This card invites you to entrust yourself to something greater with humility and sincerity, and to trust that you are guarded and guided.", "e": "A hand forming a mudra overlaps a geometric figure against layered Sanskrit mantras, symbolizing sound, symbol and intention as one.\nRepeating a mantra helps the mind settle so it is no longer pulled by stray thoughts. When you feel powerless or lost, you can silently recite this phrase and ask yourself: am I willing to let go of control and trust life’s arrangement?", "cats": {"work": "Treat work with dedication and gratitude. Do what you should do without over-attachment to the result. When you need help or guidance, be willing to consult seniors.", "health": "Regular meditation or chanting steadies body and mind. Spend a few minutes each day chanting softly or breathing quietly to help the nervous system relax.", "love": "Treat each other with respect and gratitude in love. See your partner as someone worthy of respect rather than someone to reform; the relationship deepens.", "family": "Hold gratitude and respect for family, especially elders. A sincere greeting, or a simple blessing ritual together, makes home more harmonious.", "social": "Face everyone with humility and respect. You need not control how others see you; focus on sincerity and goodwill.", "money": "Regard wealth with gratitude and contentment. Earn properly, spend with measure, and share some with those in need so wealth keeps flowing.", "growth": "Find your own quiet-mind ritual, such as chanting, prayer or meditation. Repeated practice builds trust and inner stability."}}}}, {"id": "c20", "no": "20", "name": "宇宙之音", "en": "AUM", "tag": "Listen deeply. You'll hear cosmic AUM.", "tagZh": "深深聆聽,你會聽見宇宙的「嗡」。", "keywords": "聲音、聆聽、振動、宇宙、靜心", "meaning": "當你真正安靜下來,會發現萬物都在以某種頻率共鳴。這張牌邀請你把注意力轉向內在,深深聆聽,你會聽到一個超越語言的聲音,那是與宇宙相連的感覺。", "extended": "畫面是水面上一個發光的「嗡(AUM)」符號,周圍是一圈圈擴散的波紋,象徵聲音與振動向外擴散,觸及所有存在。\n試著在安靜的環境中閉上眼睛,專注傾聽周圍的聲音,再聽聽自己的呼吸與心跳。也可以輕輕吟唱「嗡」,感受聲音在身體裡共鳴。聆聽,也包含聆聽別人真正想表達的內容。", "cats": {"work": "工作溝通時,先認真聆聽,再回應。聽見同事話語背後的需求,能避免許多誤解,也讓合作更順暢。", "health": "留意身體發出的細微訊號:疲勞、緊繃、情緒起伏。多聽聽身體在說什麼,並用呼吸、吟唱或聲音放鬆自己。", "love": "在伴侶面前,全心傾聽比急著回答更重要。放下手機、看著對方,讓對方感覺被聽見,感情會更貼近。", "family": "多聽聽家人的聲音,尤其是平時比較少說話的人。用耐心聆聽,可能會發現他們一直想說卻沒說出口的事。", "social": "做一個好的聆聽者,是最受歡迎的人際特質。專心聽、少打斷,別人會因此信任你。", "money": "對金錢的決定,多聽聽內心真正的聲音,也聽取可靠的意見。避免被噪音與流行牽著走。", "growth": "每天固定安靜幾分鐘,聽聽內在的聲音。靜心、吟唱或單純的傾聽,都是連結宇宙的入口。"}, "img": "images/20-aum.jpg", "land": false, "i18n": {"en": {"kw": "Sound, listening, vibration, cosmos, meditation", "m": "When you truly become quiet, you find that everything resonates at some frequency. This card invites you to turn your attention within and listen deeply; you will hear a sound beyond language, the feeling of being connected to the cosmos.", "e": "A glowing “AUM” symbol sits on the water, surrounded by spreading ripples, symbolizing sound and vibration spreading outward to touch all beings.\nTry closing your eyes in a quiet place, listening to the sounds around you, then to your own breath and heartbeat. You can also chant “Om” softly and feel the sound resonate in your body. Listening includes listening for what others really mean.", "cats": {"work": "In work communication, listen carefully before responding. Hearing the need behind a colleague’s words prevents many misunderstandings and smooths cooperation.", "health": "Notice the subtle signals your body sends: fatigue, tension, mood swings. Listen to what the body says, and relax with breath, chanting or sound.", "love": "With your partner, listening wholeheartedly matters more than answering quickly. Put down the phone, look at them and let them feel heard; the bond grows closer.", "family": "Listen more to family, especially those who usually speak less. Patient listening may reveal things they have long wanted to say.", "social": "Being a good listener is the most welcome social quality. Listen attentively and interrupt less, and people will trust you.", "money": "For money decisions, listen to your true inner voice and also to reliable advice. Avoid being led by noise and trends.", "growth": "Set aside a few quiet minutes daily to hear your inner voice. Meditation, chanting or simple listening are all doorways to connecting with the cosmos."}}}}, {"id": "c21", "no": "21", "name": "感恩", "en": "Gratitude", "tag": "When you've received, give it forward.", "tagZh": "當你有所領受,就把它傳遞出去。", "keywords": "感恩、傳遞、給予與領受、善的循環", "meaning": "感恩不只是說謝謝,而是把得到的善意再傳出去。這張牌提醒你,你手中已經握著許多祝福,而祝福會在流動中變得更豐盛。", "extended": "畫面中,一隻神聖的手把一顆金剛菩提子遞向下方捧著種子的雙手,象徵恩典被接住,也被繼續傳遞。\n回頭看看:最近誰幫過你?你又能把這份善意轉給誰?給予不必龐大,一個傾聽、一句鼓勵、一次主動協助,都是讓善循環下去的方式。", "cats": {"work": "對同事、主管與合作夥伴表達感謝,並把你學到的經驗分享給後進。懂得感恩與提攜,人脈與口碑會自然累積,也為自己創造被支持的環境。", "health": "感謝身體一路的陪伴,好好吃飯、睡覺、活動就是回報。也可以練習每天寫下三件感恩的小事,幫助心情安定。", "love": "別忘了對身邊的人說出感謝,也接受對方的付出而不急著回報。感情在被看見與被珍惜中成長。", "family": "對家人的付出說聲謝謝,尤其是平時默默承擔的人。把長輩給你的照顧,用你的方式傳給下一代。", "social": "有人曾在你需要時伸出援手,現在你也可以成為別人的那雙手。善意是最好的人際資產。", "money": "對你已經擁有的資源心存感謝,並適度分享與回饋。懂得流動,金錢與機會才不會停滯。", "growth": "把感恩變成每天的小習慣。感謝的心會讓你更容易看見已有的豐盛,而不是只盯著缺少的部分。"}, "img": "images/21-gratitude.jpg", "land": false, "i18n": {"en": {"kw": "Gratitude, passing it on, giving and receiving, a cycle of goodness", "m": "Gratitude is more than saying thank you; it is passing on the kindness you have received. This card reminds you that you already hold many blessings, and blessings grow richer as they flow.", "e": "A sacred hand passes a rudraksha bead to cupped hands below holding seeds, symbolizing grace being received and passed on.\nLook back: who has helped you lately, and to whom can you pass that kindness? Giving need not be grand; listening, a word of encouragement or offering help first are all ways to keep goodness circulating.", "cats": {"work": "Thank colleagues, managers and partners, and share what you have learned with newcomers. Gratitude and mentoring naturally build your network and reputation and create an environment where you are supported.", "health": "Thank your body for accompanying you all along; eating, sleeping and moving well is how you repay it. You can also write down three small things you are grateful for each day to steady your mood.", "love": "Do not forget to say thank you to those close to you, and accept their effort without rushing to repay. Love grows when it is seen and cherished.", "family": "Say thank you for what family gives, especially those who carry things quietly. Pass the care your elders gave you on to the next generation in your own way.", "social": "Someone reached out when you needed help; now you can be that hand for someone else. Kindness is the best social asset.", "money": "Be grateful for the resources you already have and share and give back in moderation. Only by letting things flow do money and opportunity not stagnate.", "growth": "Make gratitude a small daily habit. A grateful heart helps you see the abundance you already have instead of fixating on what is missing."}}}}, {"id": "c22", "no": "22", "name": "解脫", "en": "Liberate", "tag": "Relieve from all the problems and sufferings.", "tagZh": "從一切問題與痛苦中解脫。", "keywords": "解脫、放下、卸下重擔、自由", "meaning": "這張牌是一份邀請:放下那些你一直抓緊的煩惱與重擔。真正的解脫不是問題全部消失,而是你不再被它們束縛。", "extended": "金色三叉戟與達瑪鼓,是濕婆的象徵:三叉戟象徵破除過去、現在、未來的執著,鼓聲則是創造與覺醒的振動。念珠纏繞其上,提醒你信念與修持是支撐。\n問問自己:我正抓著什麼不放?是一段怨念、一個標準,還是一個過去的版本?承認它、感謝它,然後輕輕鬆手。", "cats": {"work": "放下完美主義與過度的責任感。分清哪些是你能處理的、哪些該交給別人或時間。鬆開之後,你會有更多空間做真正重要的事。", "health": "壓力與緊繃需要出口。透過運動、伸展、呼吸或專心的休息釋放累積的重量。身心長期不適時,也請尋求專業協助。", "love": "放下對對方或過去關係的怨懟與期待,感情才有重新流動的可能。若關係已成負擔,也可以誠實考慮該放手的部分。", "family": "家庭中的舊傷與角色包袱,不必由你一個人背。練習界線與原諒,讓自己與家人都鬆一口氣。", "social": "不必討好每一個人。放下別人怎麼看你的擔心,關係會更輕鬆,也更真誠。", "money": "財務上的焦慮,可以透過清楚的盤點與規劃來緩解。放下對「不夠」的恐懼,重新設定屬於你的安心標準。", "growth": "練習放下:寫下煩惱,再逐一問「這是我能控制的嗎」。靜心或誦念,能幫助你與內在的自由重新連結。"}, "img": "images/22-liberate.jpg", "land": false, "i18n": {"en": {"kw": "Liberation, letting go, setting down burdens, freedom", "m": "This card is an invitation to put down the worries and burdens you have been clutching. True liberation is not all problems disappearing but no longer being bound by them.", "e": "The golden trident and damaru are Shiva’s emblems: the trident breaks attachment to past, present and future, while the drum’s beat is the vibration of creation and awakening. Prayer beads wound around them remind you that faith and practice are your support.\nAsk yourself: what am I holding on to? A grudge, a standard, a former version of myself? Acknowledge it, thank it, then gently loosen your grip.", "cats": {"work": "Let go of perfectionism and an excessive sense of responsibility. Sort out what you can handle from what should be left to others or to time. Once you loosen up, you have more room for what truly matters.", "health": "Stress and tension need an outlet. Release accumulated weight through exercise, stretching, breathing or focused rest. If body and mind are uncomfortable for a long time, seek professional help.", "love": "Let go of resentment and expectations about your partner or past relationships, and the relationship can flow again. If a relationship has become a burden, you can also honestly consider what to let go of.", "family": "You need not carry old wounds and role baggage at home alone. Practice boundaries and forgiveness so that you and your family can breathe easier.", "social": "You do not have to please everyone. Let go of worry about what others think and relationships become lighter and more genuine.", "money": "Financial anxiety can be eased by a clear inventory and plan. Let go of the fear of “not enough” and reset your own standard for feeling secure.", "growth": "Practice letting go: write down your worries, then ask one by one, “Is this within my control?” Meditation or chanting can help you reconnect with inner freedom."}}}}, {"id": "c23", "no": "23", "name": "信念", "en": "Faith", "tag": "You did your best, and Divine will do the rest.", "tagZh": "你已盡力,其餘交給神聖。", "keywords": "信任、盡力、交託、相信過程", "meaning": "你已經做了你能做的,接下來的部分,請相信有更大的力量在安排。這張牌邀請你放下過度的掌控,在信任中等待。", "extended": "林間光線下靜靜佇立的林伽,是濕婆最樸素的象徵,不言不動,卻承載著無限。\n信念不是盲目樂觀,而是在盡力之後選擇安心。你可以問自己:我是否已經盡了力?如果是,那麼還在焦慮的,是結果還是我對掌控的需要?把結果交出去,把專注留在當下能做的事。", "cats": {"work": "專案送出、面試完畢、提案已報,剩下的就交給時間。把精力轉向下一件事,不要反覆自我審查。持續盡責,好的機會自然會來。", "health": "做好該做的保養與照顧後,學會信任身體自己的修復力。焦慮本身也會消耗體力,試著安心休息。若有症狀,仍請諮詢醫師。", "love": "感情需要信任。你已經誠心付出,就不必反覆試探或過度擔心。給彼此空間,讓關係以自己的節奏成長。", "family": "對家人的事,你已盡心,就相信他們有自己的路與力量。陪伴比控制更有力量。", "social": "相信對的人會留下,也相信時間會證明真誠。不需要每次都急著解釋或證明自己。", "money": "做好規劃與風險控管後,就不必每天盯著盤面或帳戶焦慮。保持耐心,以長期的眼光看待財富。", "growth": "培養一種「盡人事」的心態:專注過程、接納結果。每天花幾分鐘靜心或祈禱,提醒自己並不孤單。"}, "img": "images/23-faith.jpg", "land": false, "i18n": {"en": {"kw": "Trust, doing your best, entrusting, trusting the process", "m": "You have done what you can; for what comes next, trust that a greater power is at work. This card invites you to release excess control and wait in trust.", "e": "A lingam stands quietly in forest light, Shiva’s plainest symbol, silent and still yet bearing the infinite.\nFaith is not blind optimism but choosing peace after you have tried your best. Ask yourself: have I done my best? If so, what is still anxious: the outcome, or my need for control? Hand over the outcome and keep your focus on what you can do now.", "cats": {"work": "The project is submitted, the interview done, the proposal made; leave the rest to time. Turn your energy to the next thing and stop second-guessing yourself. Keep being responsible and good opportunities will come.", "health": "After doing the care and upkeep you should, trust your body’s own power to repair. Anxiety itself drains energy, so try resting with peace of mind. If there are symptoms, still consult a doctor.", "love": "Love needs trust. You have given sincerely, so there is no need to keep testing or worrying. Give each other space and let the relationship grow at its own pace.", "family": "You have done your part for family; trust they have their own path and strength. Accompanying is more powerful than controlling.", "social": "Trust that the right people will stay and that time will prove sincerity. You need not rush to explain or prove yourself every time.", "money": "After planning well and controlling risk, you need not watch the market or your accounts anxiously every day. Be patient and view wealth with a long-term eye.", "growth": "Cultivate a “do your best” attitude: focus on process, accept outcomes. Spend a few minutes a day in meditation or prayer to remind yourself you are not alone."}}}}, {"id": "c24", "no": "24", "name": "寧靜", "en": "Serenity", "tag": "You are what you seek inside. Your true self cannot be described by what you have.", "tagZh": "你所尋找的,就在你的內在。真正的你,無法用你所擁有的來定義。", "keywords": "寧靜、喜樂、內在圓滿、真我", "meaning": "寧靜來自內在,而非外在的擁有。這張牌提醒你:你不需要再多一個頭銜或條件,才有資格感到圓滿。", "extended": "畫面是一場莊嚴而喜悅的婚禮,新人被花環與花瓣包圍,眾神在旁祝福。這是濕婆與帕爾瓦蒂神聖結合的意象,象徵內在陰陽合一的喜悅。\n當你不再向外抓取,寧靜就會出現。試著問:如果不靠成就、關係、外表,我是誰?那個不被這些定義的你,才是你一直在尋找的家。", "cats": {"work": "不要用職稱與績效定義自己的價值。在忙碌中保留片刻的靜,你的判斷會更清晰,也更能穩定面對變動。", "health": "身心安寧是最好的養生。減少過度的刺激與比較,給自己留白的時間,睡眠與情緒都會因此受益。", "love": "感情的圓滿,是兩個內在完整的人彼此祝福。先安頓好自己,再與對方分享喜悅。若正處於婚姻或承諾的議題,以喜悅而非壓力去看待。", "family": "家人的團聚與慶賀是福氣。放下比較與期待,單純享受相聚的當下。", "social": "有些相聚值得慶祝。不必以社交場合的表現證明自己,真誠自在最吸引人。", "money": "財富帶來的安心,終究來自你與金錢的關係。知足、有餘裕,比追求數字更重要。", "growth": "每天留一段安靜的時間,例如散步、靜坐或呼吸。回到內在,你會發現你要找的答案一直都在。"}, "img": "images/24-serenity.jpg", "land": true, "i18n": {"en": {"kw": "Serenity, joy, inner completeness, true self", "m": "Serenity comes from within, not from what you own. This card reminds you that you do not need one more title or condition to deserve feeling complete.", "e": "A solemn and joyful wedding: the couple is surrounded by garlands and petals while gods look on in blessing. It is the image of the sacred union of Shiva and Parvati, symbolizing the joy of inner yin and yang becoming one.\nWhen you stop grasping outward, serenity appears. Try asking: without achievements, relationships or appearance, who am I? The you that is not defined by these is the home you have been seeking.", "cats": {"work": "Do not define your worth by title and performance. Keep a moment of stillness amid busyness; your judgment becomes clearer and you can face change more steadily.", "health": "Peace of body and mind is the best health care. Reduce excess stimulation and comparison and leave yourself blank time; sleep and mood will benefit.", "love": "Completeness in love is two inwardly whole people blessing each other. Settle yourself first, then share joy with your partner. If marriage or commitment is on your mind, see it with joy rather than pressure.", "family": "Family reunions and celebrations are a blessing. Drop comparison and expectation and simply enjoy the moment of being together.", "social": "Some gatherings are worth celebrating. You need not prove yourself by how you perform socially; being genuine and at ease is most attractive.", "money": "The security wealth brings ultimately comes from your relationship with money. Contentment and some margin matter more than chasing numbers.", "growth": "Keep a quiet stretch each day, such as a walk, sitting or breathing. Returning within, you will find the answers you seek have always been there."}}}}, {"id": "c25", "no": "25", "name": "智慧", "en": "Wisdom", "tag": "The less you think, the more you know.", "tagZh": "想得越少,知道得越多。", "keywords": "智慧、靜心、直觀、放下雜念", "meaning": "有時,過度思考反而讓答案更模糊。這張牌邀請你安靜下來,讓更深的智慧自然浮現。", "extended": "巨大的濕婆面容閉目低垂,而前方一位平凡的靜坐者與祂的氣息相連。這象徵每個人心中都住著那份智慧,只要安靜,就能被連結。\n如果你正在糾結,試著暫停分析,讓身體放鬆、呼吸變慢。答案往往在安靜的間隙中出現。你已知道的,比你以為的更多。", "cats": {"work": "重要決策前,給自己一段不被打擾的安靜時間。讓資訊沉澱,再用直覺與邏輯共同做判斷,而不是被資訊淹沒。", "health": "過度思慮會消耗心神與睡眠。透過靜坐、深呼吸、散步,讓大腦休息,身體也會跟著放鬆。", "love": "感情中不必反覆分析對方的每句話。回到內心,問自己真實的感受,你會知道自己需要什麼。", "family": "家庭的事不必每件都想得完美。簡單、耐心的陪伴,往往勝過複雜的計畫。", "social": "少一點揣測,多一點直接而真誠的交流。很多誤會,在好好說話之後就消失了。", "money": "不要被過多的資訊與意見干擾理財決定。回到你的原則與長期目標,簡單而一致的方式通常最穩。", "growth": "培養靜心習慣,讓思緒像水慢慢沉澱。在安靜中,你會聽見自己內在的智慧。"}, "img": "images/25-wisdom.jpg", "land": false, "i18n": {"en": {"kw": "Wisdom, meditation, intuition, quieting the mind", "m": "Sometimes overthinking blurs the answer. This card invites you to quiet down and let deeper wisdom surface naturally.", "e": "A giant face of Shiva, eyes closed and lowered, and before it an ordinary person sitting quietly, connected to his breath. It symbolizes that everyone holds this wisdom within and can connect with it simply by being still.\nIf you are tangled up, pause the analysis, let the body relax and the breath slow. Answers often appear in the gaps of quiet. You know more than you think.", "cats": {"work": "Before an important decision, give yourself some undisturbed quiet. Let information settle, then judge with both intuition and logic instead of being flooded by information.", "health": "Overthinking drains mind and sleep. Let the brain rest through sitting, deep breathing and walking; the body will relax too.", "love": "In love you need not analyze every sentence your partner says. Return within and ask what you truly feel; you will know what you need.", "family": "Not every family matter needs to be thought through perfectly. Simple, patient company often beats complicated plans.", "social": "Guess less and communicate more directly and sincerely. Many misunderstandings vanish once people talk properly.", "money": "Do not let too much information and too many opinions disturb your financial decisions. Return to your principles and long-term goals; simple and consistent is usually steadiest.", "growth": "Build a quiet-mind habit and let thoughts settle like water. In stillness you will hear your own inner wisdom."}}}}, {"id": "c26", "no": "26", "name": "由內而外", "en": "Inside out", "tag": "Lord Shiva is all. So I have all in the first place.", "tagZh": "濕婆即是一切,所以我本來就擁有一切。", "keywords": "內在豐盛、本自具足、綻放、由內而外", "meaning": "你所尋找的一切,本來就在你之內。這張牌提醒你,綻放是從內在開始,向外自然展開。", "extended": "發光的人形胸前,一朵蓮花盛開,蝴蝶與白鴿環繞,象徵靈性的開展與心的自由。\n當你相信自己本來就具足,就不會再從別人那裡乞求認可。試著把注意力從「我缺什麼」轉向「我已經有什麼」,你會看到自己早已擁有的天賦、愛與力量。", "cats": {"work": "你的價值不必由職位或他人的認可來決定。相信自己的能力與特質,主動展現,而不是等待被發現。", "health": "從內在調理身心:良好的睡眠、飲食、情緒釋放。當內在平衡,外在狀態也會跟著改善。", "love": "先愛自己,感情就不會變成乞討。你的圓滿能與對方分享,而不是依賴對方填補。", "family": "家人的愛是你的根。你也可以成為家裡的光,以穩定與溫暖影響身邊的人。", "social": "真誠做自己,就是最好的社交方式。把自信建立在內在,不需要靠比較或炫耀。", "money": "豐盛的心態是財富的起點。相信自己有創造價值的能力,同時感謝已有的資源。", "growth": "每天練習把手放在心口,對自己說:我本來就足夠。讓內在的富足成為行動的基礎。"}, "img": "images/26-inside-out.jpg", "land": false, "i18n": {"en": {"kw": "Inner abundance, already complete, blooming, inside out", "m": "Everything you seek is already within you. This card reminds you that blooming begins inside and unfolds outward naturally.", "e": "A lotus opens at the chest of a glowing figure, surrounded by butterflies and white doves, symbolizing spiritual unfolding and freedom of the heart.\nWhen you believe you are already whole, you stop begging approval from others. Try shifting attention from “what do I lack” to “what do I already have,” and you will see the gifts, love and strength you always had.", "cats": {"work": "Your worth need not be decided by your position or others’ approval. Trust your abilities and qualities and show them proactively instead of waiting to be discovered.", "health": "Tend body and mind from within: good sleep, diet and emotional release. When the inside is balanced, your outer state improves too.", "love": "Love yourself first, and love will not turn into begging. Your wholeness can be shared with your partner rather than relying on them to fill you.", "family": "Your family’s love is your root. You can also become a light at home, influencing those around you with steadiness and warmth.", "social": "Being genuinely yourself is the best way to socialize. Build confidence from within, without comparison or showing off.", "money": "An abundant mindset is where wealth begins. Believe in your ability to create value while being grateful for the resources you have.", "growth": "Each day, put a hand on your heart and say: I am already enough. Let inner richness be the foundation of action."}}}}, {"id": "c27", "no": "27", "name": "接納", "en": "Acceptance", "tag": "The key to finding peace of mind is to accept all aspects of yourself.", "tagZh": "找到內心平靜的鑰匙,是接納自己的所有面向。", "keywords": "接納、擁抱自己、和解、平靜", "meaning": "心的平靜,從不再與自己對抗開始。這張牌邀請你溫柔地接納自己的所有面向,包括光明與陰影。", "extended": "畫面中,宇宙般的身影彼此擁抱,金黃與深藍交融,象徵內在不同部分的和解。\n你可能一直在否定某個自己:太敏感、太軟弱、太固執、太平凡。試著說:「我看見你了,你也屬於我。」接納不是放棄成長,而是讓改變從愛而非批判出發。", "cats": {"work": "接受自己的限制與缺點,也接受自己的優點。別因一次失誤就否定全部的自己,從中學習、調整、再前進。", "health": "好好善待你的身體與情緒,不再苛責。接受它現在的狀態,才能溫柔地照顧它。", "love": "接納自己,才能真正接納對方。關係中少一點要求與控制,多一點理解與包容。", "family": "放下對家人或自己的「應該」,接受每個人的樣子。接納是修復關係的第一步。", "social": "不必成為所有人眼中的完美。真誠地展現自己,對的人會喜歡你原本的樣子。", "money": "接受自己與金錢相處的習慣與過去的決定,不責備自己。從現在起重新規劃,往前走就好。", "growth": "靜坐時,對浮現的每一種情緒輕聲說「我接納你」。擁抱自己,是最深的療癒。"}, "img": "images/27-acceptance.jpg", "land": false, "i18n": {"en": {"kw": "Acceptance, embracing yourself, reconciliation, peace", "m": "Peace of mind begins when you stop fighting yourself. This card invites you to gently accept all aspects of yourself, light and shadow alike.", "e": "Cosmic-like figures embrace each other, gold and deep blue blending, symbolizing reconciliation among inner parts.\nYou may have been denying some version of yourself: too sensitive, too weak, too stubborn, too ordinary. Try saying, “I see you, and you belong to me.” Acceptance is not giving up growth; it lets change start from love instead of judgment.", "cats": {"work": "Accept your limits and flaws, and also your strengths. Do not negate your whole self over one mistake; learn, adjust, and move on.", "health": "Treat your body and emotions kindly without harsh blame. Accepting your present state lets you care for it gently.", "love": "Only by accepting yourself can you truly accept your partner. Ask less and control less in the relationship; offer more understanding and tolerance.", "family": "Drop the “shoulds” about family or yourself and accept each person as they are. Acceptance is the first step in repairing relationships.", "social": "You need not be perfect in everyone’s eyes. Show yourself sincerely and the right people will like you as you are.", "money": "Accept your habits with money and past decisions without blaming yourself. Replan from now and simply move forward.", "growth": "In meditation, say softly “I accept you” to each emotion that arises. Embracing yourself is the deepest healing."}}}}, {"id": "c28", "no": "28", "name": "蛻變", "en": "Transform", "tag": "Embracing change. Make room for something that serves you.", "tagZh": "擁抱改變,為更適合你的事物騰出空間。", "keywords": "蛻變、改變、重生、放下舊殼", "meaning": "舊的皮該褪去了。這張牌告訴你,改變正在發生,放下不再適合你的,才能為新的成長騰出空間。", "extended": "蛇蛻下舊皮,在光中展現新的色彩。蛇在濕婆的意象中象徵能量與重生。蛻變常伴隨不適,卻是成長必經的過程。\n想一想:哪些習慣、關係或信念,已經像舊皮一樣緊了?你不必一次全放下,先從一個小改變開始,例如結束一個消耗你的習慣。", "cats": {"work": "是轉換跑道、學習新技能或調整角色的時機。接受不確定,逐步嘗試,新的方向會在行動中變得清晰。", "health": "改變生活習慣的好時機。從小處開始,例如調整作息、增加運動,並給身體時間適應。", "love": "關係可能進入新階段。放下舊的模式與期待,誠實面對彼此的成長,也許能找到更合適的相處方式。", "family": "家庭結構或角色的轉變,需要彈性與耐心。溝通新的安排,讓每個人都找到舒服的位置。", "social": "也許是時候調整人際圈,離開消耗你的關係,靠近讓你成長的人。", "money": "重新檢視你的財務習慣與規劃。放下不再適用的做法,為更適合現階段的方式騰出空間。", "growth": "允許自己成為新的樣子。記錄改變中的感受,並肯定自己走過的每一步。"}, "img": "images/28-transform.jpg", "land": false, "i18n": {"en": {"kw": "Transformation, change, rebirth, shedding the old skin", "m": "The old skin is ready to be shed. This card tells you change is happening, and letting go of what no longer fits makes room for new growth.", "e": "A snake sheds its old skin and shows new colors in the light. In Shiva’s imagery the snake stands for energy and rebirth. Transformation often brings discomfort yet is a necessary part of growth.\nThink: which habits, relationships or beliefs have become tight like old skin? You need not release everything at once; start with one small change, such as ending one habit that drains you.", "cats": {"work": "A time to switch tracks, learn new skills or adjust your role. Accept uncertainty and try step by step; the new direction becomes clear through action.", "health": "A good time to change lifestyle habits. Start small, such as adjusting your schedule or adding exercise, and give your body time to adapt.", "love": "The relationship may be entering a new stage. Let go of old patterns and expectations, face each other’s growth honestly, and you may find a better way of being together.", "family": "Changes in family structure or roles need flexibility and patience. Talk through new arrangements so everyone finds a comfortable place.", "social": "It may be time to adjust your circle: leave relationships that drain you and move toward people who help you grow.", "money": "Review your financial habits and plans. Drop methods that no longer apply and make room for ones that fit your present stage.", "growth": "Allow yourself to become someone new. Record how you feel through the change and affirm every step you have taken."}}}}, {"id": "c29", "no": "29", "name": "安全", "en": "Safe", "tag": "You are safe under Lord Shiva's protection.", "tagZh": "你在濕婆的守護之下,是安全的。", "keywords": "安全、守護、信賴、被保護", "meaning": "你被守護著。這張牌帶來安心的訊息:在你覺得脆弱或不安時,有一股溫柔而堅定的力量在你身後。", "extended": "濕婆的側影與三叉戟立於身後,碎裂的鏡面與面紗後露出一雙凝視的眼睛,象徵在不安與遮蔽之中,你依然被看見、被守護。\n若你最近感到恐懼或不確定,先讓呼吸慢下來,感覺腳踩在地上。你並非赤手空拳面對一切。同時,也留意現實中可以尋求協助的資源與人。", "cats": {"work": "職場上若有壓力或不確定,先穩住自己,再一步步處理。保留重要紀錄、向可信任的人求助,也是在保護自己。", "health": "身體需要安全感才能修復。創造安心的作息與環境,感到不適時及時就醫,不要獨自撐著。", "love": "在關係中,你有權利感到安全與被尊重。若感到不安,誠實說出需要,並留意是否被善待。", "family": "家是安全的港灣。也請守護好你自己的界線,讓家中的每個人都能安心。", "social": "選擇讓你感到安全與被尊重的人相處。信任需要時間累積,不必急著打開所有防備。", "money": "建立緊急預備金與基本保障,讓安全感有實質的支持。重大財務決定前,多方確認。", "growth": "在心中想像被光包覆的畫面,或誦念讓你安心的祈禱文。安全感可以從內在被喚起。"}, "img": "images/29-safe.jpg", "land": false, "i18n": {"en": {"kw": "Safety, protection, trust, being protected", "m": "You are guarded. This card brings reassurance: when you feel vulnerable or uneasy, a gentle yet firm power stands behind you.", "e": "Shiva’s profile and trident stand behind, and behind a shattered mirror and veil a gazing pair of eyes appears, symbolizing that amid unease and concealment you are still seen and protected.\nIf you have felt fear or uncertainty lately, slow your breath first and feel your feet on the ground. You are not facing everything empty-handed. Also notice the real-world resources and people you can turn to for help.", "cats": {"work": "If work brings pressure or uncertainty, steady yourself first, then handle things step by step. Keeping important records and asking trusted people for help is also a way of protecting yourself.", "health": "The body needs safety to heal. Create a reassuring routine and environment, and seek medical care promptly when unwell instead of enduring alone.", "love": "In a relationship you have the right to feel safe and respected. If you feel uneasy, say what you need honestly and notice whether you are treated well.", "family": "Home is a safe harbor. Also guard your own boundaries so everyone at home can feel at ease.", "social": "Choose the company of people who make you feel safe and respected. Trust builds over time; you need not drop all defenses at once.", "money": "Build an emergency fund and basic protection so security has real support. Confirm things from several sources before major financial decisions.", "growth": "Imagine being wrapped in light, or recite a prayer that comforts you. Security can be evoked from within."}}}}, {"id": "c30", "no": "30", "name": "選擇", "en": "Choices", "tag": "There is no wrong path. Make a choice that you won't regret later.", "tagZh": "沒有錯誤的路。做出你日後不會後悔的選擇。", "keywords": "選擇、抉擇、岔路、為自己負責", "meaning": "面對岔路,你不需要找「唯一正確」的答案。這張牌提醒你,每條路都有它的風景,重要的是選了之後,你願意為它負責。", "extended": "兩扇拱門分別映出不同的人與世界,南迪牛背對著我們,安靜地凝視。祂不替你選擇,只是陪伴你看清。\n試著問自己:如果選這條,我十年後會怎麼看?哪一個選擇更貼近我真正的價值?不必追求零風險,而是選出你能全心投入、事後也不會懊悔的那條。", "cats": {"work": "面對職涯選擇,列出你真正在乎的價值與條件,而非只看眼前的利弊。選定之後全力以赴,遇到調整也能更快修正。", "health": "在不同的治療或生活方式之間選擇時,蒐集足夠的資訊並諮詢專業意見。選擇符合你身體與生活節奏的方式。", "love": "感情上的抉擇,誠實面對你的真實感受。無論選擇繼續或放手,都為自己的決定負責。", "family": "家庭中的決定常牽涉多人。溝通各自的需求,尋找兼顧彼此的方案,但不要放棄自己的底線。", "social": "選擇與誰相處,也是選擇你想成為怎樣的人。把時間留給真正滋養你的關係。", "money": "面對投資與消費的選擇,回到你的長期目標與風險承受度。不必追逐每個機會,選適合你的就好。", "growth": "做決定前,先安靜下來聽聽內在的聲音。完成選擇後,練習不再反覆回頭質疑。"}, "img": "images/30-choices.jpg", "land": false, "i18n": {"en": {"kw": "Choice, decision, crossroads, taking responsibility", "m": "At a fork in the road you need not find the “only right” answer. This card reminds you that every path has its scenery; what matters is that after choosing, you are willing to take responsibility for it.", "e": "Two archways reflect different people and worlds, while Nandi the bull faces away from us, gazing quietly. He does not choose for you; he only keeps you company while you see clearly.\nTry asking: if I choose this, how will I see it ten years from now? Which choice is closer to my real values? You need not seek zero risk; choose the one you can commit to fully and will not regret afterward.", "cats": {"work": "For career choices, list the values and conditions you truly care about, not just immediate pros and cons. Once you choose, give it your all, and you can correct course faster when adjustments arise.", "health": "When choosing between treatments or lifestyles, gather enough information and consult professionals. Choose what fits your body and life rhythm.", "love": "For a romantic decision, face your true feelings honestly. Whether you choose to continue or let go, take responsibility for your decision.", "family": "Family decisions often involve many people. Communicate everyone’s needs and look for solutions that consider all sides, but do not give up your own bottom line.", "social": "Choosing whom to spend time with is also choosing who you want to become. Keep your time for relationships that truly nourish you.", "money": "For investment and spending choices, return to your long-term goals and risk tolerance. You need not chase every opportunity; choose what suits you.", "growth": "Before deciding, quiet down and listen to your inner voice. After choosing, practice not turning back to doubt it again and again."}}}}, {"id": "c31", "no": "31", "name": "依靠", "en": "Rely on", "tag": "Allow yourself to be embraced with unconditional love.", "tagZh": "允許自己被無條件的愛擁抱。", "keywords": "依靠、被愛、接受支持、家的溫暖", "meaning": "你不必什麼都自己扛。這張牌邀請你放鬆,允許自己被愛、被扶持,把重量交給值得信賴的人與力量。", "extended": "畫面是一家人的溫柔依偎:帕爾瓦蒂輕撫著疲憊閉眼的濕婆,象神甘尼夏依在他們懷中。這是一幅無條件的愛與安全依靠的畫面。\n總是堅強的你,也有累的時候。接受幫助不是軟弱,而是讓愛流動。想想看,現在誰可以讓你依靠?你是否也願意成為別人的依靠?", "cats": {"work": "不必凡事親力親為。懂得分工與請求協助,才能走得更遠。尋找可以討論、請益的前輩與夥伴。", "health": "累的時候,允許自己休息與被照顧。身心需要溫柔對待,不是只有堅持。", "love": "在關係中學會示弱並接受愛。真誠地表達需要,對方才有機會支持你。", "family": "家是可以卸下防備的地方。珍惜與家人的依偎與陪伴,也主動給予擁抱與關心。", "social": "找幾個可以真心傾訴的朋友。被理解與陪伴,會讓你更有力量面對生活。", "money": "必要時尋求可信賴的專業或家人協助,一起規劃財務。不必一個人承擔所有壓力。", "growth": "想像自己被一股溫暖的愛包圍。在安靜時,讓自己感受被支持,而不是只想著要堅強。"}, "img": "images/31-rely-on.jpg", "land": false, "i18n": {"en": {"kw": "Reliance, being loved, receiving support, the warmth of home", "m": "You do not have to carry everything yourself. This card invites you to relax, allow yourself to be loved and supported, and hand some of the weight to people and powers you can trust.", "e": "A family nestles tenderly: Parvati gently strokes the weary, closed-eyed Shiva while Ganesha leans into their arms. It is a picture of unconditional love and a safe place to rely on.\nEven the always-strong get tired. Accepting help is not weakness; it lets love flow. Think: who can you lean on now? Are you also willing to be someone others can lean on?", "cats": {"work": "You need not do everything yourself. Knowing how to divide work and ask for help takes you farther. Find seniors and partners you can discuss things with and learn from.", "health": "When tired, allow yourself to rest and be cared for. Body and mind need gentleness, not only persistence.", "love": "Learn to show vulnerability and accept love in a relationship. Express your needs sincerely so your partner has the chance to support you.", "family": "Home is where you can lower your guard. Cherish leaning on and being with family, and offer hugs and care yourself.", "social": "Find a few friends you can confide in. Being understood and accompanied gives you more strength for life.", "money": "When necessary, seek reliable professionals or family to plan finances together. You need not bear all the pressure alone.", "growth": "Imagine being wrapped in warm love. In quiet moments, let yourself feel supported instead of only thinking about being strong."}}}}, {"id": "c32", "no": "32", "name": "循環", "en": "Cycle", "tag": "Every ending is a new beginning and every beginning has an end.", "tagZh": "每個結束都是新的開始,每個開始也都有終點。", "keywords": "循環、月相、結束與開始、順應節奏", "meaning": "萬事都有周期,如月亮盈虧。這張牌提醒你,一個階段的結束,其實是下一個階段的起點。", "extended": "濕婆靜坐於雪山前,十二個月相圍繞著祂,從滿月到新月再回到滿月。祂頭上的新月象徵時間與循環,也象徵在變化中的平靜。\n你現在處於哪個月相?是需要播種、成長、豐收,還是休息?順著自己的節奏,不強求在新月期就要滿月,也不為月缺而哀傷。", "cats": {"work": "工作有高峰與低谷。低潮時蓄積實力、整理經驗;高峰時把握機會,同時為下一個周期做準備。", "health": "身體也有節律。順應季節與作息,在該休息的時候休息,在有力氣時活動。", "love": "關係有熱絡與平淡的周期。把平淡視為深化的階段,而不是退場的訊號。若關係結束,也是一個階段的完成。", "family": "家庭成員成長、遷移、告別,都是生命的周期。珍惜相聚的時光,也學習接受轉變。", "social": "人際關係會隨階段改變。感謝曾經陪伴你的人,也歡迎新的緣分進入。", "money": "金錢有起伏。盈餘時儲備、低谷時保守,以長期的眼光看待周期,不被短期的變動左右。", "growth": "觀察月亮的變化,與自己的節奏對話。每個階段都有它的功課,也都有它的美。"}, "img": "images/32-cycle.jpg", "land": false, "i18n": {"en": {"kw": "Cycles, moon phases, endings and beginnings, following the rhythm", "m": "Everything has its cycle, like the waxing and waning moon. This card reminds you that the end of one stage is the start of the next.", "e": "Shiva sits quietly before snow mountains, surrounded by twelve moon phases from full to new and back to full. The crescent on his head symbolizes time and cycles, and calm amid change.\nWhich phase are you in now? Do you need to sow, grow, harvest or rest? Follow your own rhythm; do not force fullness in a new-moon period, and do not grieve a waning one.", "cats": {"work": "Work has peaks and troughs. In a low, build strength and organize experience; at a peak, seize opportunities while preparing for the next cycle.", "health": "The body has rhythms too. Follow the seasons and your routine: rest when it is time to rest, be active when you have energy.", "love": "Relationships have warm and plain cycles. Treat plain periods as a stage of deepening, not a sign of withdrawal. If a relationship ends, that too is a stage completed.", "family": "Family members growing up, moving, saying goodbye are all cycles of life. Cherish time together and learn to accept change.", "social": "Relationships change with life stages. Thank those who have accompanied you and welcome new connections.", "money": "Money rises and falls. Save in surplus and be conservative in lows; take a long-term view of cycles and do not be swayed by short-term swings.", "growth": "Watch the moon’s changes and talk with your own rhythm. Every stage has its lesson and its beauty."}}}}, {"id": "c33", "no": "33", "name": "我是", "en": "I AM", "tag": "Be true to yourself.", "tagZh": "忠於自己。", "keywords": "海底輪、根基、自我認同、真實", "meaning": "「我是」是所有力量的根基。這張牌邀請你回到最底層的安全感與認同,忠於真實的自己。", "extended": "紅色的海底輪(Muladhara)位於脊椎底端,象徵生存、安全與歸屬,是大地之力的根。\n問問自己:我是否真的活在自己認同的方式裡?當你忠於自己,內在會有踏實的穩定感。這不是固執,而是清楚知道自己是誰、需要什麼。", "cats": {"work": "不必為了迎合而扭曲自己。清楚說出你的價值與界線,並在能發揮專長的位置上穩穩站好。", "health": "回到身體的基本:規律作息、穩定飲食、腳踏實地的運動。腳踏實地的生活能帶來安全感。", "love": "在關係裡保持真實,不假裝成對方期待的樣子。真實的相遇才能長久。", "family": "家是歸屬感的來源。回到家人間的連結,也確認你自己在家中的位置與界線。", "social": "忠於自己的原則,選擇接受你原本樣子的朋友。你不必成為別人。", "money": "金錢的基本安全感很重要。建立穩定收入與基本儲備,讓你能更有底氣做選擇。", "growth": "每天花幾分鐘感受雙腳與地面的接觸,對自己說「我是」。從根基開始建立自信。"}, "img": "images/33-i-am.jpg", "land": false, "i18n": {"en": {"kw": "Root chakra, foundation, identity, authenticity", "m": "“I am” is the foundation of all strength. This card invites you to return to the deepest sense of security and identity, and to be true to yourself.", "e": "The red root chakra (Muladhara) sits at the base of the spine, symbolizing survival, safety and belonging, the root of earth’s power.\nAsk yourself: am I really living the way I identify with? When you are true to yourself, inside there is a grounded steadiness. It is not stubbornness but clearly knowing who you are and what you need.", "cats": {"work": "You need not distort yourself to please. Say your values and boundaries clearly and stand firmly in a position where your strengths can shine.", "health": "Return to bodily basics: regular routine, steady diet, grounded exercise. A down-to-earth life brings a sense of safety.", "love": "Stay genuine in relationships and do not pretend to be who your partner expects. Only an authentic meeting lasts.", "family": "Home is a source of belonging. Return to the connection among family and also confirm your own place and boundaries at home.", "social": "Stay true to your principles and choose friends who accept you as you are. You do not have to become someone else.", "money": "Basic financial security matters. Build stable income and basic savings so you can choose with more confidence.", "growth": "Spend a few minutes each day feeling your feet on the ground and say “I am.” Build confidence from the foundation up."}}}}, {"id": "c34", "no": "34", "name": "我感受", "en": "I FEEL", "tag": "Your feeling matters. Focus on what you feel both internally and externally.", "tagZh": "你的感受很重要。留意你內在與外在的感覺。", "keywords": "臍輪、情感、感受、創造力", "meaning": "你的感受有價值。這張牌邀請你停下來,誠實地感受內在的情緒與外在的環境。", "extended": "橙色的臍輪(Svadhisthana)位於下腹,象徵情感、流動、創造與喜悅,如水般柔軟。\n情緒不是障礙,而是訊息。當你感到疲憊、喜悅、不安,都值得被承認。試著問:現在我身體哪裡有感覺?那是什麼情緒?不評判,只是看見。", "cats": {"work": "留意工作中讓你有活力與消耗你的事。你的感受是重要的線索,指引你更適合的方向與做法。", "health": "情緒與身體相連。壓力常以不適的形式出現,給情緒表達的出口,例如書寫、運動、與人傾訴。", "love": "誠實說出你的感受,也傾聽對方的感受。感情在被理解中加深,而不是在壓抑中維持。", "family": "家人之間的情緒需要空間。允許彼此有情緒,並以尊重的方式溝通。", "social": "留意與誰相處時你感到輕鬆、與誰相處後疲憊。你的感覺會告訴你哪些關係值得投入。", "money": "金錢常與情緒有關,例如因情緒而衝動消費。花錢前先停一下,辨認自己的感受。", "growth": "每天做一次情緒盤點:我現在感覺如何?把它寫下來,培養與感受相處的能力。"}, "img": "images/34-i-feel.jpg", "land": false, "i18n": {"en": {"kw": "Sacral chakra, emotion, feeling, creativity", "m": "Your feelings have value. This card invites you to pause and honestly feel your inner emotions and your outer surroundings.", "e": "The orange sacral chakra (Svadhisthana) sits in the lower abdomen, symbolizing emotion, flow, creativity and joy, soft like water.\nEmotions are not obstacles but messages. Tiredness, joy and unease all deserve acknowledgment. Try asking: where do I feel something in my body right now, and what emotion is it? No judgment, just seeing.", "cats": {"work": "Notice what energizes and what drains you at work. Your feelings are important clues pointing to a better-fitting direction and way of working.", "health": "Emotions and body are linked. Stress often appears as discomfort, so give emotion an outlet such as writing, exercise or talking with someone.", "love": "Say your feelings honestly and also listen to your partner’s. A relationship deepens through being understood, not through suppression.", "family": "Emotions between family members need space. Allow each other to have feelings and communicate with respect.", "social": "Notice who you feel at ease with and who leaves you drained. Your feelings tell you which relationships are worth investing in.", "money": "Money is often tied to emotion, such as impulse spending when upset. Pause before spending and identify what you are feeling.", "growth": "Take a daily emotional inventory: how do I feel right now? Write it down to build the ability to be with your feelings."}}}}, {"id": "c35", "no": "35", "name": "我行動", "en": "I DO", "tag": "Believe in your actions like Lord Shiva always believes in you.", "tagZh": "相信你的行動,就像濕婆始終相信你。", "keywords": "太陽神經叢輪、行動力、意志、自信", "meaning": "你已經有行動的力量。這張牌鼓勵你相信自己的決定,並勇敢採取行動。", "extended": "黃色的太陽神經叢輪(Manipura)位於上腹,象徵意志、自信與行動力,如同內在的太陽。\n如果你一直在想卻沒開始,試著從一小步做起。行動不需要等到完美,信任自己,走出去,過程中再調整。祂相信你,你也可以相信你自己。", "cats": {"work": "是展現主動與領導力的時候。提出你的想法、承擔任務,用行動證明能力,並接受過程中的調整。", "health": "動起來有益身心。選擇你喜歡的運動,從小目標開始建立習慣。注意不過度逞強。", "love": "感情中,主動表達心意或邁出一步。清楚而溫和地說出你想要的,而不是等待對方猜測。", "family": "家中有需要處理的事,不要拖延。主動承擔並與家人分工,能讓氣氛更和諧。", "social": "主動聯繫、主動邀約或主動協助。你的一個小行動,可能就是關係的轉機。", "money": "把財務目標拆成具體行動,例如固定儲蓄、學習理財。持續執行比一次性的大動作更有效。", "growth": "每天完成一件你一直拖延的小事。累積這些小勝利,自信會自然提升。"}, "img": "images/35-i-do.jpg", "land": false, "i18n": {"en": {"kw": "Solar plexus chakra, action, will, confidence", "m": "You already have the power to act. This card encourages you to trust your decisions and take action bravely.", "e": "The yellow solar plexus chakra (Manipura) sits in the upper abdomen, symbolizing will, confidence and action, like an inner sun.\nIf you have been thinking without starting, begin with one small step. Action need not wait for perfection; trust yourself, go out, and adjust along the way. He believes in you, and you can believe in yourself.", "cats": {"work": "A time to show initiative and leadership. Offer your ideas, take on tasks, prove your ability through action, and accept adjustments along the way.", "health": "Moving is good for body and mind. Choose exercise you enjoy and build habits from small goals. Take care not to overdo it.", "love": "In love, express your feelings or take a step forward. Say what you want clearly and gently instead of waiting for your partner to guess.", "family": "If something at home needs handling, do not delay. Taking initiative and dividing tasks with family makes the atmosphere more harmonious.", "social": "Reach out, invite, or offer help first. One small action from you may be the turning point of a relationship.", "money": "Break financial goals into concrete actions, such as regular saving and learning about money. Steady execution beats a one-off big move.", "growth": "Finish one small thing you have been putting off each day. Accumulating these small wins naturally raises your confidence."}}}}, {"id": "c36", "no": "36", "name": "我愛", "en": "I LOVE", "tag": "Open your heart to feel the love inside you.", "tagZh": "敞開你的心,感受內在的愛。", "keywords": "心輪、愛、慈悲、敞開", "meaning": "愛從你的心開始。這張牌邀請你放下防備,感受內在本來就有的愛與慈悲。", "extended": "綠色的心輪(Anahata)位於胸口,象徵愛、慈悲與連結,六芒星是天與地的結合。\n也許過去的傷讓你有些封閉。你不必一下子完全敞開,只要允許自己感受一點溫柔。對自己好一點,再把這份愛分享給他人。", "cats": {"work": "以善意與同理對待同事與客戶。在工作中帶入關懷,能建立更深的信任與合作關係。", "health": "愛自己是健康的基礎。善待你的身體與心情,並關注胸口與呼吸,讓心放鬆下來。", "love": "感情的核心是愛與慈悲。放下防備,真誠表達愛意,也允許自己接受愛。", "family": "對家人表達愛與感謝。擁抱、一句關心,都是讓家更溫暖的力量。", "social": "以開放的心看待他人,多一點善意與寬容。你的溫柔也會吸引同樣善意的人。", "money": "以愛與分享的心看待金錢。適度回饋與捐助,能讓你感受到給予的富足。", "growth": "將手放在心口,深呼吸,對自己說「我愛你」。每天練習,讓愛成為內在的底色。"}, "img": "images/36-i-love.jpg", "land": false, "i18n": {"en": {"kw": "Heart chakra, love, compassion, opening", "m": "Love starts from your heart. This card invites you to lower your guard and feel the love and compassion that are already within you.", "e": "The green heart chakra (Anahata) sits at the chest, symbolizing love, compassion and connection; the six-pointed star is the union of heaven and earth.\nPerhaps past hurt has closed you off somewhat. You need not open fully at once; just allow yourself to feel a little tenderness. Be kinder to yourself first, then share that love with others.", "cats": {"work": "Treat colleagues and clients with kindness and empathy. Bringing care into work builds deeper trust and cooperation.", "health": "Loving yourself is the foundation of health. Treat your body and mood kindly, and attend to your chest and breath so the heart relaxes.", "love": "Love and compassion are the core of a relationship. Lower your guard, express love sincerely, and allow yourself to receive love.", "family": "Express love and thanks to family. A hug or a word of concern gives strength to warm the home.", "social": "View others with an open heart and offer more kindness and tolerance. Your gentleness will also attract people of like goodwill.", "money": "View money with a spirit of love and sharing. Giving back and donating in moderation lets you feel the abundance of giving.", "growth": "Place a hand on your heart, breathe deeply and say to yourself “I love you.” Practice daily and let love become your inner undertone."}}}}, {"id": "c37", "no": "37", "name": "我表達", "en": "I SPEAK", "tag": "Express yourself. The world wants to know about you.", "tagZh": "表達你自己。世界想要認識你。", "keywords": "喉輪、表達、真實發聲、溝通", "meaning": "你的聲音值得被聽見。這張牌鼓勵你誠實、清楚地表達自己的想法與感受。", "extended": "藍綠色的喉輪(Vishuddha)位於喉嚨,象徵溝通、真實與表達,連結著心與語言。\n也許你一直把話放在心裡。試著用簡單、真誠的方式說出來,不需要完美。表達不是為了說服,而是讓真實的你被看見。", "cats": {"work": "在會議與合作中勇敢提出想法與需求。清楚溝通能避免誤解,也讓你的價值被看見。", "health": "喉嚨與頸肩常反映壓抑的情緒。透過說話、唱歌、書寫來釋放,也留意身體發出的訊號。", "love": "好好說出你的感受與需要,溫和而誠實。溝通是感情中最重要的橋樑。", "family": "與家人直接而尊重地表達。把話說清楚,能減少猜測與誤會。", "social": "真誠地分享你自己,也樂於傾聽他人。好的交流是雙向的。", "money": "清楚談論金錢的議題,如預算、分擔與規劃,避免因迴避而產生壓力或誤解。", "growth": "試著每天寫日記或對著鏡子說出真實的想法,練習把內在的聲音說出口。"}, "img": "images/37-i-speak.jpg", "land": false, "i18n": {"en": {"kw": "Throat chakra, expression, speaking truth, communication", "m": "Your voice deserves to be heard. This card encourages you to express your thoughts and feelings honestly and clearly.", "e": "The blue-green throat chakra (Vishuddha) sits at the throat, symbolizing communication, truth and expression, linking heart and language.\nPerhaps you have been keeping things inside. Try saying them in a simple, sincere way; it need not be perfect. Expression is not to persuade but to let the real you be seen.", "cats": {"work": "Speak up with ideas and needs in meetings and collaborations. Clear communication prevents misunderstanding and lets your value be seen.", "health": "Throat, neck and shoulders often reflect suppressed emotion. Release it through speaking, singing or writing, and notice the signals your body gives.", "love": "Say your feelings and needs well, gently and honestly. Communication is the most important bridge in love.", "family": "Express yourself to family directly and respectfully. Saying things clearly reduces guessing and misunderstanding.", "social": "Share yourself sincerely and be glad to listen to others. Good exchange runs both ways.", "money": "Talk clearly about money matters such as budgets, shared costs and planning, to avoid stress or misunderstanding from avoidance.", "growth": "Try writing a journal daily or saying your true thoughts to a mirror, practicing speaking your inner voice aloud."}}}}, {"id": "c38", "no": "38", "name": "我看見", "en": "I SEE", "tag": "Open your eyes, the truth is right in front of you.", "tagZh": "睜開你的眼睛,真相就在你面前。", "keywords": "眉心輪、直覺、洞察、看清真相", "meaning": "答案可能就在眼前,只是你還沒看清。這張牌邀請你打開內在的眼睛,看見事情的本質。", "extended": "靛藍色的眉心輪(Ajna)位於雙眉之間,也就是常說的第三眼,象徵直覺、洞察與智慧。濕婆的額頭正是第三眼所在。\n暫時放下先入為主的想法與他人的聲音,安靜地看一看真實的情況。你的直覺往往比你以為的更準確。", "cats": {"work": "看清局勢與細節,辨識真正的機會與風險。信任你的直覺,同時以事實驗證。", "health": "留意身體給你的訊號,不要忽略細小的不適。信任直覺,同時尋求專業的檢查與意見。", "love": "看清關係的真實面貌,包含對方的優點與你自己的需求。不被幻想或恐懼左右。", "family": "留意家人間沒有說出口的需要與情緒。用心觀察,能更準確地回應。", "social": "看清誰是真誠的朋友,誰讓你耗損。觀察對方的行動,比聽他說什麼更可靠。", "money": "仔細檢視財務的真實狀況與合約內容。看清楚之後再決定,避免被表象或情緒帶著走。", "growth": "靜心時把注意力放在眉心,觀察念頭的來去。練習看見,而不是被念頭帶著走。"}, "img": "images/38-i-see.jpg", "land": false, "i18n": {"en": {"kw": "Third eye chakra, intuition, insight, seeing the truth", "m": "The answer may be right in front of you, just not yet clearly seen. This card invites you to open your inner eye and see the essence of things.", "e": "The indigo third eye chakra (Ajna) sits between the brows, the so-called third eye, symbolizing intuition, insight and wisdom. Shiva’s forehead is exactly where the third eye lies.\nSet aside preconceptions and other people’s voices for a moment and quietly look at the real situation. Your intuition is often more accurate than you think.", "cats": {"work": "See the situation and details clearly, and recognize real opportunities and risks. Trust your intuition and verify it with facts.", "health": "Notice the signals your body gives and do not ignore small discomforts. Trust your intuition while also seeking professional checks and opinions.", "love": "See the true face of the relationship, including your partner’s strengths and your own needs. Do not be swayed by fantasy or fear.", "family": "Notice the unspoken needs and emotions among family. Careful observation lets you respond more accurately.", "social": "See clearly who is a sincere friend and who drains you. Watching what someone does is more reliable than listening to what they say.", "money": "Examine your real financial situation and contract terms carefully. Decide after seeing clearly, so you are not led by appearances or emotion.", "growth": "In meditation, place attention between the brows and watch thoughts come and go. Practice seeing instead of being carried by thoughts."}}}}, {"id": "c39", "no": "39", "name": "我理解", "en": "I UNDERSTAND", "tag": "Don't judge what you don't understand.", "tagZh": "不要評斷你不理解的事。", "keywords": "頂輪、理解、不評斷、開闊", "meaning": "你不必立刻下結論。這張牌提醒你,保持開放與謙遜,在理解之前不輕易評斷。", "extended": "紫色的頂輪(Sahasrara)位於頭頂,象徵智慧、合一與超越,千瓣蓮花向宇宙敞開。新月與念珠環繞,象徵濕婆的頭冠。\n每個人都有自己的故事與視角。當你想評斷時,先問:我真的了解他的處境嗎?保持好奇,你會發現更寬廣的世界。", "cats": {"work": "面對不同的做事方式與意見,先了解背後的原因。開放的態度能讓團隊合作更有彈性。", "health": "不要輕易批評自己的身心狀態或他人的生活方式。以理解與好奇探索什麼對你有效。", "love": "多一點理解與傾聽,少一點評斷與假設。感情在被理解時最溫暖。", "family": "不同世代的家人,價值觀會有差異。試著了解對方的成長背景,能減少許多衝突。", "social": "放下標籤與刻板印象,以好奇心認識每個人。你會發現更多有趣的連結。", "money": "對不熟悉的理財工具或觀念,先學習了解,再決定要不要參與,而非盲目否定或盲目追隨。", "growth": "練習放下「我是對的」的執著。保持開放,讓智慧在理解中自然成長。"}, "img": "images/39-i-understand.jpg", "land": false, "i18n": {"en": {"kw": "Crown chakra, understanding, non-judgment, openness", "m": "You need not draw conclusions immediately. This card reminds you to stay open and humble, and not to judge before you understand.", "e": "The violet crown chakra (Sahasrara) sits at the top of the head, symbolizing wisdom, oneness and transcendence, a thousand-petaled lotus open to the cosmos. A crescent moon and prayer beads encircle it like Shiva’s crown.\nEveryone has their own story and perspective. When you want to judge, first ask: do I really understand their situation? Stay curious and you will find a wider world.", "cats": {"work": "Facing different ways of working and opinions, first understand the reasons behind them. An open attitude makes teamwork more flexible.", "health": "Do not casually criticize your own body and mind or others’ lifestyles. Explore what works for you with understanding and curiosity.", "love": "Offer more understanding and listening, less judgment and assumption. A relationship is warmest when understood.", "family": "Different generations differ in values. Try to understand each other’s background and many conflicts can be reduced.", "social": "Drop labels and stereotypes and get to know each person with curiosity. You will find more interesting connections.", "money": "For unfamiliar financial tools or ideas, learn about them first and then decide whether to take part, rather than blindly rejecting or blindly following.", "growth": "Practice letting go of the attachment to “I am right.” Stay open and let wisdom grow naturally through understanding."}}}}, {"id": "c40", "no": "40", "name": "終點之門", "en": "Gateway to the end", "tag": "You can't close an awakening eye. Just accept and take this journey to the end.", "tagZh": "覺醒的眼睛無法再閉上。接受它,把這趟旅程走到最後。", "keywords": "覺醒、旅程、完成、無法回頭", "meaning": "當覺醒的眼睛已經睜開,就無法再假裝沒看見。這張牌邀請你接受這趟旅程,勇敢走完。", "extended": "濕婆的身影化為宇宙,眾神與守護者站在兩側,無數的人影從光中走來。這是一趟與整個宇宙同行的旅程。\n你已經走了很遠,知道了許多。不必害怕前方的未知,也不必回頭。接受你所看見的,懷著信任,把這段路走到終點,那裡有你真正的完成。", "cats": {"work": "當你已經看清自己想走的方向,就不必猶豫。接受過程中的挑戰,朝著目標一步步完成。", "health": "照顧身心是一生的旅程。接受自己目前的狀態,持續以溫柔的方式前進,不必急於一時。", "love": "感情的路上,接受你所看見的真相。無論走向承諾或告別,都帶著清醒與尊重完成它。", "family": "家庭是一段長遠的旅程。接受每個階段的轉變與課題,並與家人一起走下去。", "social": "你已經認識了許多人與事。接受每段緣分的來去,珍惜同行的人,也感謝離開的人。", "money": "財務是長期旅程。接受過程中的起伏,持續執行你的計畫,完成屬於你的階段目標。", "growth": "覺醒之後不必恐懼。每天繼續你的修習,相信旅程本身就是目的。"}, "img": "images/40-gateway.jpg", "land": false, "i18n": {"en": {"kw": "Awakening, journey, completion, no turning back", "m": "Once the awakened eye has opened, you cannot pretend not to see. This card invites you to accept this journey and walk it bravely to the end.", "e": "Shiva’s figure becomes the cosmos, with gods and guardians standing on both sides and countless figures coming out of the light. It is a journey with the whole universe.\nYou have come far and learned much. You need not fear the unknown ahead, nor turn back. Accept what you have seen, and with trust walk this road to its end, where your true completion lies.", "cats": {"work": "Once you see clearly the direction you want, do not hesitate. Accept the challenges along the way and complete it step by step toward your goal.", "health": "Caring for body and mind is a lifelong journey. Accept your present state and keep moving forward gently; there is no need to hurry.", "love": "On the road of love, accept the truth you see. Whether it leads to commitment or farewell, complete it with clarity and respect.", "family": "Family is a long journey. Accept the changes and lessons of each stage and keep walking together with your family.", "social": "You have met many people and things. Accept the coming and going of each connection, cherish those who walk with you and thank those who leave.", "money": "Finance is a long journey. Accept the ups and downs, keep carrying out your plan and complete the stage goals that are yours.", "growth": "There is no need to fear after awakening. Keep up your practice each day and trust that the journey itself is the purpose."}}}}]}]}</script>

var UI={"前往八吉祥商城選購":"Shop this deck at Eight Auspicious","喜歡這副牌?帶一副回家":"Love this deck? Take one home","實體牌卡在八吉祥商城販售,把今天抽到的訊息,延伸成每天的陪伴。":"The physical deck is sold in the Eight Auspicious shop — let today's message stay with you every day.","所有牌組":"All decks","首頁":"Home","選擇牌組":"Choose a deck","進入牌組 →":"Enter the deck →","更多牌組即將推出":"More decks coming soon","新的牌卡正在準備中,敬請期待。":"New decks are being prepared. Stay tuned.","選一副牌,靜下心來,抽一張,聽聽它想對你說的話。":"Pick a deck, settle your mind, draw one card, and hear what it has to say.","多種牌卡的線上抽牌站":"Online card draws, many decks","還沒有可以顯示的牌組。":"No decks to show yet.","🔊 朗讀":"🔊 Listen","⏹ 停止":"⏹ Stop","牌卡數量不足":"Not enough cards","牌卡介紹": "The Deck", "線上抽牌": "Online Draw", "後台管理": "Admin", "神諭卡・牌意與線上抽牌": "Oracle cards · meanings & online draw", "神 諭 卡": "O R A C L E", "以濕婆為意象的神諭卡。先靜下心來,想著此刻最在意的事,再抽一張牌,聽聽它想對你說的話。": "An oracle deck inspired by Shiva. Settle your mind, hold what matters most to you right now, then draw a card and hear what it has to say.", "開始抽牌": "Start drawing", "瀏覽牌卡": "Browse the cards", "開始線上抽牌 →": "Start the online draw →", "牌陣": "Spread", "單張指引": "Single card", "三張時間流": "Past · Present · Future", "想問的問題(選填,只留在你的畫面)": "Your question (optional; stays on your screen only)", "例如:接下來三個月,我在工作上要留意什麼?": "e.g. What should I be aware of at work over the next three months?", "想看哪個面向的解讀": "Which area would you like read?", "洗牌並抽牌": "Shuffle & draw", "洗牌中…": "Shuffling…", "全部翻開": "Reveal all", "重新抽牌": "Draw again", "點一下牌背即可翻開": "Tap a card back to reveal it", "牌卡數量不足,請改選單張,或先在後台新增牌卡。": "Not enough cards for this spread. Choose a single card or add cards in the admin.", "搜尋牌名或關鍵字": "Search card name or keyword", "例如:耐心": "e.g. patience", "找不到符合的牌卡。": "No matching cards found.", "牌意": "Meaning", "延伸意義": "Deeper meaning", "牌意整理中": "Meaning coming soon", "此面向的解讀整理中": "This reading is coming soon", "關閉": "Close", "牌卡詳情": "Card details", "主選單": "Main menu", "解讀面向": "Reading areas", "牌卡一覽": "All cards", "封底": "Back cover", "關於這副牌": "About this deck", "三大神卡": "The Three Great Gods", "In Shiva's Eyes Oracle 牌組封面": "In Shiva's Eyes Oracle box cover", "本站只收錄牌卡內容": "", "四十張牌": "Forty cards", "從「本源」「潛能」到「宇宙之音」,四十張牌各有主題,涵蓋覺察、放下、勇氣、陪伴與靜心。": "From “Origin” and “Potential” to “AUM,” each of the forty cards has its own theme, covering awareness, letting go, courage, companionship and stillness.", "以濕婆的視角": "Through Shiva’s eyes", "濕婆是毀滅與重生、靜止與舞動的象徵。牌面以他的眼光,提醒你看見表象之下真正的自己。": "Shiva stands for destruction and rebirth, stillness and dance. The cards look through his eyes, reminding you to see the true self beneath appearances.", "七個生活面向": "Seven areas of life", "每張牌除了牌意與延伸意義,另有工作、健康、感情、家庭、人際、金錢、成長的分別解讀。": "Besides its meaning and deeper meaning, every card has separate readings for work, health, love, family, relationships, money and personal growth.", "不預言,只陪伴": "No predictions, just company", "神諭卡不是宿命的宣判,而是一面鏡子,幫助你整理心緒、提出好問題。": "An oracle deck is not a verdict of fate but a mirror that helps you sort your thoughts and ask better questions.", "如何使用這副牌": "How to use the deck", "靜下來": "Settle", "深呼吸幾次,帶著一個你想了解的問題或心情。": "Take a few deep breaths and hold a question or feeling you want to understand.", "抽牌": "Draw", "單張牌看今日指引,三張牌看過去、現在、未來。": "One card for today’s guidance; three cards for past, present and future.", "對照解讀": "Read", "先看直覺的感受,再讀牌意;依問題選擇對應的面向。": "Notice your gut feeling first, then read the meaning; pick the area that fits your question.", "帶一句話走": "Take one line with you", "選一句最有共鳴的話,放在今天的生活裡實踐。": "Choose the sentence that resonates most and put it into practice today.", "梵天 Brahma": "Brahma", "創造者 The Creator": "The Creator", "象徵創造、起始與知識。當你想開啟新的計畫或方向,梵天提醒你,一切從清楚的意念開始。": "Symbolizes creation, beginnings and knowledge. When you want to start a new plan or direction, Brahma reminds you that everything begins with a clear intention.", "毗濕奴 Vishnu": "Vishnu", "守護者 The Preserver": "The Preserver", "象徵維繫、守護與秩序。當你需要穩住現狀、照顧所愛,毗濕奴代表持續而溫柔的守護。": "Symbolizes sustaining, protecting and order. When you need to hold steady and care for those you love, Vishnu stands for continuous, gentle protection.", "濕婆 Shiva": "Shiva", "毀滅者 The Destroyer": "The Destroyer", "象徵破除、轉化與釋放。放下不再需要的,才能為新的生命騰出空間,這是濕婆舞蹈的意義。": "Symbolizes breaking through, transformation and release. Letting go of what is no longer needed makes room for new life; this is the meaning of Shiva’s dance.", "牌組附贈的三張神明卡:創造、守護、轉化,是生命運行的三個面向。": "The three deity cards that come with the deck: creation, preservation and transformation, the three aspects of how life moves.", "目前顯示的是範例牌卡。": "Sample cards are shown.", "牌卡內容整理中,敬請期待。": "Card content is on its way. Please check back soon."};

/* ---------- read aloud: recorded audio if provided, otherwise browser speech ---------- */
var SPK={audio:null,btn:null,q:[]};
function canSpeak(){return !!(window.speechSynthesis&&window.SpeechSynthesisUtterance)}
function stopSpeak(){
  try{if(SPK.audio){SPK.audio.pause();SPK.audio=null}}catch(e){}
  SPK.q=[];try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  if(SPK.btn){SPK.btn.textContent=T("🔊 朗讀");SPK.btn.classList.remove("on")}SPK.btn=null;
}
function speakText(c,key){
  var tx=(key&&key!=="all"&&c.cats&&c.cats[key])?c.cats[key]:[c.meaning,c.extended].filter(Boolean).join("\n");
  return (c.name?c.name+(LANG==="en"?".\n":"。\n"):"")+tx;
}
function pickVoice(lang){
  var vs=speechSynthesis.getVoices()||[],pre=lang==="en"?["en-US","en-GB","en"]:["zh-TW","zh-HK","zh-CN","zh"];
  for(var i=0;i<pre.length;i++){var v=vs.filter(function(x){return x.lang&&x.lang.replace("_","-").indexOf(pre[i])===0})[0];if(v)return v}
  return null;
}
function audioFor(c,key){
  var L=LANG==="en"?"en":"zh",o=(c.i18n&&c.i18n[L])||{};
  if(c.isRev)return (!key||key==="all")?(c.audio||""):"";
  if(!key||key==="all")return c.audio||"";
  return (o.ca&&o.ca[key])||"";
}
function startSpeak(btn){
  var c=byId(btn.dataset.id);if(!c)return;if(btn.dataset.rev==="1")c=asRev(c);
  var was=SPK.btn===btn;stopSpeak();if(was)return;
  SPK.btn=btn;btn.textContent=T("⏹ 停止");btn.classList.add("on");
  var au=audioFor(c,btn.dataset.key);
  if(au){
    var a=new Audio(src(au));SPK.audio=a;a.onended=a.onerror=function(){if(SPK.audio===a)stopSpeak()};
    a.play().catch(function(){stopSpeak()});return;
  }
  if(!canSpeak()){stopSpeak();return}
  var lang=LANG==="en"?"en":"zh",parts=speakText(c,btn.dataset.key).split(/(?<=[。!?!?.\n])/).map(function(s){return s.trim()}).filter(Boolean);
  SPK.q=parts;
  (function next(){
    if(SPK.btn!==btn)return;
    var s=SPK.q.shift();if(!s){stopSpeak();return}
    var u=new SpeechSynthesisUtterance(s);u.lang=lang==="en"?"en-US":"zh-TW";u.rate=.92;
    var v=pickVoice(lang);if(v)u.voice=v;
    u.onend=next;u.onerror=function(){stopSpeak()};
    speechSynthesis.speak(u);
  })();
}
function showSpeakBtns(root){
  (root||document).querySelectorAll(".speak").forEach(function(b){
    var c=byId(b.dataset.id);if(c&&b.dataset.rev==="1")c=asRev(c);b.hidden=!(c&&(audioFor(c,b.dataset.key)||canSpeak()))
  });
}

/* ---------- draw ---------- */
function shuffleSecure(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){var r=new Uint32Array(1);crypto.getRandomValues(r);var j=r[0]%(i+1);var t=a[i];a[i]=a[j];a[j]=t}
  return a;
}
function start(){
  var d=state.draw,n=d.spread;
  if(pool().length<n){toast(T("牌卡數量不足"));return}
  d.phase="shuffling";d.picks=[];d.flipped=[];render();
  var st=$(".stage");if(st&&st.scrollIntoView)st.scrollIntoView({block:"center",behavior:"smooth"});
  setTimeout(function(){
    d.picks=shuffleSecure(pool().map(function(c){return c.id})).slice(0,n);
    d.flipped=d.picks.map(function(){return false});
    d.rev=d.picks.map(function(id){var c=byId(id),r=new Uint32Array(1);crypto.getRandomValues(r);return !!(revOn()&&c&&revCan(c)&&(r[0]&1))});
    d.phase="dealt";render();
    var s=$(".stage");if(s&&s.scrollIntoView)s.scrollIntoView({block:"center",behavior:"smooth"});
  },1300);
}
function flip(i){
  var d=state.draw;if(d.flipped[i])return;
  d.flipped[i]=true;
  var b=document.querySelector('.flip[data-i="'+i+'"]');if(b)b.classList.add("flipped");

    if(!window.createImageBitmap||!/^image\/(jpeg|png|webp)$/.test(file.type))return res({blob:file,land:false});
    createImageBitmap(file).then(function(bm){
      var land=bm.width>bm.height*1.05,s=Math.min(1,1600/Math.max(bm.width,bm.height));
      if(s===1&&file.size<2500000)return res({blob:file,land:land});
      var cv=document.createElement("canvas");cv.width=Math.round(bm.width*s);cv.height=Math.round(bm.height*s);
      cv.getContext("2d").drawImage(bm,0,0,cv.width,cv.height);
      cv.toBlob(function(b){res({blob:b||file,land:land})},"image/jpeg",.9);
    }).catch(function(){res({blob:file,land:false})});
  });
}
async function upload(file){
  var assets=await window.claude.use("assets");
  if(!assets)throw new Error("noassets");
  var p=await prep(file),r=await assets.upload(p.blob);
  return {id:r.id,land:p.land};
}
async function addFiles(files){
  files=files.filter(function(f){return /^image\//.test(f.type)});
  if(!files.length)return;
  files.sort(function(a,b){return a.name.localeCompare(b.name,"zh-Hant",{numeric:true})});
  state.busy=true;updateBar();var ok=0;
  for(var i=0;i<files.length;i++){
    toast("上傳中 "+(i+1)+" / "+files.length,60000);
    try{
      var u=await upload(files[i]);
      state.cards.push({id:uid(),no:"",name:files[i].name.replace(/\.[^.]+$/,""),en:"",tag:"",tagZh:"",keywords:"",meaning:"",extended:"",cats:{},img:u.id,land:u.land});ok++;
    }catch(err){toast("「"+files[i].name+"」上傳失敗,請稍後重試。",5000);break}
  }
  state.busy=false;if(ok){state.dirty=true;toast("已上傳 "+ok+" 張,請填寫牌意後發布")}
  render();
}
async function replaceImage(id,file){
  var c=state.cards.filter(function(x){return x.id===id})[0];if(!c)return;
  state.busy=true;updateBar();toast("上傳中…",60000);
  try{var u=await upload(file);c.img=u.id;c.land=u.land;state.dirty=true;toast("圖片已更換")}catch(err){toast("上傳失敗,請稍後重試。",5000)}
  state.busy=false;render();
}
async function setSetting(k,file){
  state.busy=true;updateBar();toast("上傳中…",60000);
  try{var u=await upload(file);state.settings[k]=u.id;state.dirty=true;toast("圖片已更換")}catch(err){toast("上傳失敗,請稍後重試。",5000)}
  state.busy=false;render();
}
async function publish(){
  var artifact=await window.claude.use("artifact");
  if(!artifact){toast("目前無法發布(沒有編輯權限)");return}
  state.busy=true;updateBar();
  var keep={TITLE:1,META:1,STYLE:1,SCRIPT:1,LINK:1};
  syncDeck();var data=JSON.stringify({v:3,decks:state.decks}).replace(/</g,"\\u003c");
  var parts=[];
  Array.prototype.forEach.call(document.body.children,function(n){
    var ok=keep[n.tagName]||["app","overlay","toast","bgfx"].indexOf(n.id)>-1||(n.tagName.toLowerCase()==="svg"&&n.classList.contains("svg-defs"));
    if(!ok)return;
    var c=n.cloneNode(true);
    if(n.id==="app"||n.id==="overlay"||n.id==="toast")c.innerHTML="";
    if(n.id==="bgfx"){var cv=c.querySelector("canvas");if(cv){cv.removeAttribute("width");cv.removeAttribute("height");cv.removeAttribute("style")}}
    if(n.id==="cards-data")c.textContent=data;
    parts.push(c.outerHTML);
  });
  var reset="",ss=document.head.querySelectorAll("style");
  for(var i=0;i<ss.length;i++){if(ss[i].textContent.indexOf("safe-area-inset")>-1){reset=ss[i].textContent;break}}
  if(!reset)reset=":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  var html='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+parts.join("")+'</body></html>';
  try{await artifact.publish(html);toast("已發布,頁面將重新載入")}
  catch(err){
    state.busy=false;updateBar();
    toast(err&&err.code==="conflict"?"網站剛被更新,頁面將重新載入,請重做剛才的變更":"發布失敗:"+((err&&err.message)||"請稍後重試"),6000);
  }
}

/* ---------- starfield ---------- */
(function(){
  var c=$("#sky");if(!c||!c.getContext)return;
  var x=c.getContext("2d"),W=0,H=0,S=[],star=null,dpr=Math.min(window.devicePixelRatio||1,2);
  var still=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){
    W=window.innerWidth;H=window.innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+"px";c.style.height=H+"px";
    var n=Math.min(260,Math.round(W*H/8000));S=[];
    for(var i=0;i<n;i++)S.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.25+.25,p:Math.random()*6.28,s:.5+Math.random()*1.4});
  }
  function frame(t){
    x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
    var col=(getComputedStyle(document.documentElement).getPropertyValue("--star")||"#fff").trim();
    x.fillStyle=col;
    for(var i=0;i<S.length;i++){var s=S[i];x.globalAlpha=.25+.75*(Math.sin(t/1000*s.s+s.p)*.5+.5);x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill()}
    if(!still){
      if(!star&&Math.random()<.003)star={x:Math.random()*W*.8,y:Math.random()*H*.35,vx:7+Math.random()*4,vy:3+Math.random()*2,l:0};
      if(star){star.x+=star.vx;star.y+=star.vy;star.l++;var a=Math.max(0,1-star.l/38);
        var g=x.createLinearGradient(star.x,star.y,star.x-star.vx*9,star.y-star.vy*9);g.addColorStop(0,col);g.addColorStop(1,"transparent");
        x.globalAlpha=a;x.strokeStyle=g;x.lineWidth=1.6;x.beginPath();x.moveTo(star.x,star.y);x.lineTo(star.x-star.vx*9,star.y-star.vy*9);x.stroke();
        if(star.l>38)star=null}
      requestAnimationFrame(frame);
    }
  }
  size();window.addEventListener("resize",function(){size();if(still)frame(0)});
  requestAnimationFrame(frame);
})();
